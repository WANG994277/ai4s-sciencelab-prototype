<text x="970.0" y="2415.0" text-anchor="middle" dominant-baseline="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" fill="#526782"><tspan x="970.0" dy="0">按需</tspan></text>
<text x="40" y="51.5" text-anchor="start" dominant-baseline="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="30" font-weight="650" fill="#0B2146"><tspan x="40" dy="0">ScienceLab AI4S  /  科研人员使用旅程</tspan></text>
<text x="40" y="117.0" text-anchor="start" dominant-baseline="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#526782"><tspan x="40" dy="0">核心入口：科研超级中枢｜提交问题与材料 → 确认计划 → 中枢组织读、算 → 人工复核与迭代</tspan></text>
<text x="95" y="376.88" text-anchor="start" dominant-baseline="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" fill="#526782"><tspan x="95" dy="0">起点：已有研究目标或待解决问题。</tspan><tspan x="95" dy="23.12">课题空间提供研究归属；</tspan><tspan x="95" dy="23.12">读、算操作围绕科研超级中枢展开。</tspan></text>
<text x="1100" y="589.86" text-anchor="start" dominant-baseline="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" fill="#526782"><tspan x="1100" dy="0">中枢可以调用底层知识、模型与工具。</tspan><tspan x="1100" dy="21.76">科研人员通过中枢推进任务，</tspan><tspan x="1100" dy="21.76">本旅程不要求其进入 AI 中台开发工具。</tspan><tspan x="1100" dy="21.76">底层服务接入状态以实际环境为准。</tspan></text>
<text x="130" y="1222.36" text-anchor="start" dominant-baseline="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" fill="#526782"><tspan x="130" dy="0">读、算按计划选择和组合，</tspan><tspan x="130" dy="21.76">可以只读、只算或读算迭代。</tspan><tspan x="130" dy="21.76">图中两支不要求同时执行，</tspan><tspan x="130" dy="21.76">在产出节点汇集本次实际结果。</tspan></text>
<text x="95" y="2204.38" text-anchor="start" dominant-baseline="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" fill="#526782"><tspan x="95" dy="0">“依据充分”并不等于假设成立。</tspan><tspan x="95" dy="23.12">反驳假设或保留分歧，也可以形成</tspan><tspan x="95" dy="23.12">有来源、有边界的阶段判断。</tspan></text>
<text x="40" y="2630.94" text-anchor="start" dominant-baseline="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="650" fill="#0B2146"><tspan x="40" dy="0">图例：实框＝原型现有或本地演示；虚框＝尚待接入或未核实的业务环节。</tspan><tspan x="40" dy="23.12">实箭头＝正常推进；虚箭头＝退回、跨角色交接或可选路径。</tspan></text>
<text x="40" y="2723.44" text-anchor="start" dominant-baseline="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" fill="#526782"><tspan x="40" dy="0">交付：阶段判断、证据与产物、下一轮研究问题或待评审材料。</tspan><tspan x="40" dy="23.12">当前读、算运行仍为演示；权限申请、异常重试与成果送审的具体联动需在目标环境核实。</tspan></text>
<text x="40" y="2801.0" text-anchor="start" dominant-baseline="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" font-weight="400" fill="#526782"><tspan x="40" dy="0">角色与系统分工依据用户确认；对应原型模块参考本工作区。更新：2026-10-10</tspan></text>
</svg>