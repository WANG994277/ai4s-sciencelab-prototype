<rect x="1100" y="728" width="315" height="114" rx="8" fill="#FFFFFF" stroke="#526782" stroke-width="2" stroke-dasharray="7 5"/>
<text x="1257.5" y="759.16" text-anchor="middle" dominant-baseline="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#0B2146"><tspan x="1257.5" dy="0">明确影响、责任与处理措施</tspan><tspan x="1257.5" dy="25.840000000000003">按权限确认计划或资源调整</tspan><tspan x="1257.5" dy="25.840000000000003">[过程管理 · 管理决策]</tspan></text>
<rect x="530" y="1060" width="360" height="104" rx="8" fill="#FFFFFF" stroke="#085FD7" stroke-width="2" />
<text x="710.0" y="1086.16" text-anchor="middle" dominant-baseline="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#0B2146"><tspan x="710.0" dy="0">04  进入课题核查阶段依据</tspan><tspan x="710.0" dy="25.840000000000003">查看任务、报告、证据与验证计划</tspan><tspan x="710.0" dy="25.840000000000003">[空间概览 · 科学问题 · 科研任务]</tspan></text>
