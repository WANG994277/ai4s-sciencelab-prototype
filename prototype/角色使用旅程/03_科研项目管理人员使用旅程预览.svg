<text x="710.0" y="261.15999999999997" text-anchor="middle" dominant-baseline="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#0B2146"><tspan x="710.0" dy="0">01  进入科研管理</tspan><tspan x="710.0" dy="25.840000000000003">定位目标项目与待办事项</tspan><tspan x="710.0" dy="25.840000000000003">[门户 → 科研管理]</tspan></text>
<rect x="530" y="390" width="360" height="104" rx="8" fill="#FFFFFF" stroke="#526782" stroke-width="2" stroke-dasharray="7 5"/>
<text x="710.0" y="416.15999999999997" text-anchor="middle" dominant-baseline="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#0B2146"><tspan x="710.0" dy="0">02  核对目标与阶段交付要求</tspan><tspan x="710.0" dy="25.840000000000003">明确里程碑、职责与验收依据</tspan><tspan x="710.0" dy="25.840000000000003">[立项管理 / 项目资料]</tspan></text>
