<rect x="530" y="2080" width="360" height="104" rx="8" fill="#FFFFFF" stroke="#526782" stroke-width="2" stroke-dasharray="7 5"/>
<text x="710.0" y="2106.16" text-anchor="middle" dominant-baseline="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#0B2146"><tspan x="710.0" dy="0">09  核对版本、授权与可用范围</tspan><tspan x="710.0" dy="25.840000000000003">按需发布资源并进入发现目录</tspan><tspan x="710.0" dy="25.840000000000003">[AI4S · 科研资源]</tspan></text>
<rect x="530" y="2245" width="360" height="104" rx="8" fill="#FFFFFF" stroke="#526782" stroke-width="2" stroke-dasharray="7 5"/>
<text x="710.0" y="2271.16" text-anchor="middle" dominant-baseline="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#0B2146"><tspan x="710.0" dy="0">10  交给科研超级中枢使用</tspan><tspan x="710.0" dy="25.840000000000003">科研人员在研究任务中调用与复核</tspan><tspan x="710.0" dy="25.840000000000003">[科研超级中枢 · 任务会话]</tspan></text>
<rect x="1100" y="2240" width="315" height="118" rx="8" fill="#FFFFFF" stroke="#526782" stroke-width="2" stroke-dasharray="7 5"/>
<text x="1257.5" y="2273.16" text-anchor="middle" dominant-baseline="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#0B2146"><tspan x="1257.5" dy="0">接收失败样例与适用性反馈</tspan><tspan x="1257.5" dy="25.840000000000003">回 AI 中台修订并再次验证</tspan><tspan x="1257.5" dy="25.840000000000003">[使用反馈 → AI 中台]</tspan></text>
<rect x="530" y="2380" width="360" height="78" rx="8" fill="#FFFFFF" stroke="#526782" stroke-width="2" stroke-dasharray="7 5"/>
<text x="710.0" y="2406.08" text-anchor="middle" dominant-baseline="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#0B2146"><tspan x="710.0" dy="0">交付可复用能力</tspan><tspan x="710.0" dy="25.840000000000003">进入持续维护阶段</tspan></text>
<rect x="432.0" y="410" width="46" height="30" fill="white" rx="3"/>
<text x="455.0" y="425.0" text-anchor="middle" dominant-baseline="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" fill="#526782"><tspan x="455.0" dy="0">是</tspan></text>
