<text x="975.0" y="1345.0" text-anchor="middle" dominant-baseline="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" fill="#526782"><tspan x="975.0" dy="0">否</tspan></text>
<rect x="728.0" y="1455" width="46" height="30" fill="white" rx="3"/>
<text x="751.0" y="1470.0" text-anchor="middle" dominant-baseline="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" fill="#526782"><tspan x="751.0" dy="0">是</tspan></text>
<rect x="760.0" y="1835" width="100" height="30" fill="white" rx="3"/>
<text x="810.0" y="1850.0" text-anchor="middle" dominant-baseline="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" fill="#526782"><tspan x="810.0" dy="0">跨系统交接</tspan></text>
<rect x="927.0" y="2250" width="132" height="30" fill="white" rx="3"/>
<text x="993.0" y="2265.0" text-anchor="middle" dominant-baseline="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" fill="#526782"><tspan x="993.0" dy="0">问题 / 需求</tspan></text>
<text x="40" y="51.5" text-anchor="start" dominant-baseline="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="30" font-weight="650" fill="#0B2146"><tspan x="40" dy="0">ScienceLab AI4S  /  科研工具创建人员使用旅程</tspan></text>
<text x="40" y="117.0" text-anchor="start" dominant-baseline="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#526782"><tspan x="40" dy="0">建设主场：AI 中台｜接收需求 → 复用或新建 → 开发调试与验证 → 发布能力 → AI4S 登记与科研调用</tspan></text>
<text x="80" y="1098.54" text-anchor="start" dominant-baseline="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="650" fill="#0B2146"><tspan x="80" dy="0">具体工具创建在 AI 中台完成。</tspan><tspan x="80" dy="24.48">AI4S 中的资产登记表单</tspan><tspan x="80" dy="24.48">不替代开发、调试和运行验证。</tspan><tspan x="80" dy="24.48">此图不假定某一种模型、SDK</tspan><tspan x="80" dy="24.48">或特定 AI 中台菜单。</tspan></text>
<text x="1100" y="1655.32" text-anchor="start" dominant-baseline="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" fill="#526782"><tspan x="1100" dy="0">能力发布 ≠ 资源上架。</tspan><tspan x="1100" dy="23.12">发布说明哪个版本可以被调用；</tspan><tspan x="1100" dy="23.12">上架说明哪些用户可以发现它。</tspan><tspan x="1100" dy="23.12">实际调用仍需满足权限与依赖条件。</tspan></text>
<text x="90" y="1972.82" text-anchor="start" dominant-baseline="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" fill="#526782"><tspan x="90" dy="0">登记、关联或同步的具体方式</tspan><tspan x="90" dy="23.12">需与实际 AI 中台方案对齐。</tspan><tspan x="90" dy="23.12">本图不假定已经自动打通</tspan><tspan x="90" dy="23.12">API、单点登录或目录同步。</tspan></text>
<text x="40" y="2545.94" text-anchor="start" dominant-baseline="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="650" fill="#0B2146"><tspan x="40" dy="0">图例：实框＝现有或已确认的角色动作；虚框＝业务级环节，具体页面或联动尚待核实。</tspan><tspan x="40" dy="23.12">实箭头＝正常推进；虚箭头＝修改重试、跨系统交接或使用反馈。</tspan></text>
<text x="40" y="2645.94" text-anchor="start" dominant-baseline="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" fill="#526782"><tspan x="40" dy="0">交付：可识别的能力版本、调用与复用说明、测试依据、适用边界和维护责任。</tspan><tspan x="40" dy="23.12">用户已明确“工具在 AI 中台创建”；当前工作区未提供 AI 中台页面，因此不将图中中台步骤视作已验证功能。</tspan></text>
<text x="40" y="2711.0" text-anchor="start" dominant-baseline="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" font-weight="400" fill="#526782"><tspan x="40" dy="0">角色与系统分工依据用户确认；对应原型模块参考本工作区。更新：2026-10-10</tspan></text>
</svg>