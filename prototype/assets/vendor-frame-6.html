<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>新建科研智能体 · AI4S</title>
  <style>
:root {
  --blue: #2f5bea;
  --blue-hover: #234bd6;
  --blue-soft: #eef2ff;
  --blue-line: #b9c8f7;
  --ink: #1f2329;
  --ink-2: #3b4250;
  --muted: #7a8190;
  --muted-2: #a2a8b3;
  --line: #e7e9ee;
  --line-2: #dcdfe6;
  --field: #f7f8fa;
  --bg: #f5f6f8;
  font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", -apple-system, sans-serif;
  color: var(--ink);
  font-size: 14px;
  line-height: 1.5;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #fff; }
body { overflow: hidden; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
button:disabled { cursor: not-allowed; opacity: .5; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
h1, h2, h3, h4, p { margin: 0; }
ul, ol { margin: 0; padding: 0; list-style: none; }
svg { display: block; flex: none; }
a { color: var(--blue); text-decoration: none; }
[hidden] { display: none !important; }

/* ---------- 顶栏 ---------- */
.top { height: 62px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 20px 0 14px; border-bottom: 1px solid var(--line); background: #fff; position: relative; z-index: 5; }
.top-l { display: flex; align-items: center; gap: 12px; min-width: 0; }
.back { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 6px; color: var(--ink); }
.back:hover { background: var(--bg); }
.avatar { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; background: #e6edff; color: var(--blue); flex: none; position: relative; }
.avatar:hover::after { content: "更换"; position: absolute; inset: 0; border-radius: 10px; background: rgba(31, 35, 41, .55); color: #fff; font-size: 11px; display: grid; place-items: center; }
.avatar.purple { background: #f0e9ff; color: #7a4be0; }
.avatar.green { background: #e3f6ec; color: #1c8a52; }
.avatar.orange { background: #fdefe2; color: #d0650f; }
.avatar.teal { background: #e0f5f5; color: #13868a; }
.avatar.pink { background: #fde8f0; color: #c93c74; }
.title-box { min-width: 0; }
.title-row { display: flex; align-items: center; gap: 6px; }
.title-row b { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 360px; }
.title-row input { font-size: 15px; font-weight: 600; border: 1px solid var(--blue); border-radius: 6px; padding: 2px 8px; width: 260px; outline: none; }
.icon-btn { width: 26px; height: 26px; display: grid; place-items: center; border-radius: 6px; color: var(--ink-2); }
.icon-btn:hover { background: var(--bg); color: var(--ink); }
.badges { display: flex; gap: 6px; margin-top: 3px; }
.badge { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 7px; border-radius: 4px; font-size: 12px; color: var(--ink-2); border: 1px solid var(--line-2); background: #fff; }
.badge.gray { background: #eceef2; border-color: #eceef2; color: #5b6270; }
.badge.ok { background: #e7f6ee; border-color: #e7f6ee; color: #1c8a52; }
.seg { display: flex; padding: 3px; border-radius: 8px; background: #f0f1f4; }
.seg button { height: 30px; padding: 0 16px; border-radius: 6px; font-size: 14px; color: var(--muted); }
.seg button.on { background: #fff; color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0, 0, 0, .08); }
.top-r { display: flex; align-items: center; justify-content: flex-end; gap: 14px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 34px; padding: 0 16px; border-radius: 8px; background: var(--blue); color: #fff; font-size: 14px; font-weight: 500; white-space: nowrap; }
.btn:hover { background: var(--blue-hover); }
.btn.lg { height: 38px; padding: 0 18px; font-size: 15px; }
.btn.ghost { background: #fff; color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--line-2); }
.btn.ghost:hover { background: var(--bg); }
.btn.sm { height: 28px; padding: 0 10px; font-size: 13px; border-radius: 6px; }
.menu { position: absolute; top: 54px; right: 20px; background: #fff; border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 30px rgba(20, 30, 50, .12); padding: 6px; min-width: 200px; z-index: 20; }
.menu button { display: flex; width: 100%; align-items: center; gap: 8px; height: 34px; padding: 0 10px; border-radius: 6px; font-size: 13.5px; color: var(--ink-2); text-align: left; }
.menu button:hover { background: var(--bg); }
.menu button.danger { color: #d23b3b; }
.menu .mh { padding: 6px 10px 8px; font-size: 12.5px; color: var(--muted); border-bottom: 1px solid var(--line); margin-bottom: 4px; }
.menu .hrow { padding: 8px 10px; font-size: 13px; color: var(--ink-2); border-radius: 6px; }
.menu .hrow small { display: block; color: var(--muted); font-size: 12px; }

/* ---------- 主体：左配置 右预览 ---------- */
.main { display: grid; grid-template-columns: var(--lw, 800px) 10px 1fr; height: calc(100vh - 62px); }
.cfg { overflow: auto; padding: 18px 30px 60px 30px; border-right: 1px solid var(--line); scrollbar-width: thin; }
.splitter { position: relative; cursor: col-resize; background: #fff; }
.splitter::after { content: ""; position: absolute; left: 50%; top: 50%; width: 4px; height: 18px; transform: translate(-50%, -50%); background: radial-gradient(circle, #9aa1ad 1px, transparent 1.4px) 0 0 / 4px 4px; }
.splitter:hover { background: #f1f3f7; }

.group > .gh { display: flex; align-items: center; gap: 8px; height: 36px; font-size: 15px; color: var(--ink-2); width: 100%; }
.group > .gh svg { transition: transform .15s; }
.group.fold > .gh svg { transform: rotate(-90deg); }
.group.fold > .gbody { display: none; }
.gbody { padding: 2px 0 10px 32px; }

.item { padding: 16px 0; border-bottom: 1px solid var(--line); }
.item:last-child { border-bottom: 0; }
.ih { display: flex; align-items: center; gap: 10px; min-height: 36px; }
.ih > svg { color: var(--ink-2); }
.ih h3 { font-size: 16px; font-weight: 600; color: var(--ink); }
.ih .tg { width: 24px; height: 24px; display: grid; place-items: center; border-radius: 5px; color: var(--ink-2); }
.ih .tg:hover { background: var(--bg); }
.ih .tg svg { transition: transform .15s; }
.item.fold .ih .tg svg { transform: rotate(180deg); }
.item.fold .ib { display: none; }
.ih .sp { flex: 1; }
.ih .add { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 6px; color: var(--ink-2); }
.ih .add:hover { background: var(--bg); color: var(--blue); }
.idesc { color: var(--muted); font-size: 13.5px; margin-top: 6px; line-height: 1.7; }
.ib { margin-top: 10px; }
.ib.flat { margin-top: 0; }
.none { color: var(--muted); font-size: 13.5px; margin-top: 10px; }

.sel { position: relative; }
.sel select { appearance: none; -webkit-appearance: none; height: 40px; min-width: 180px; padding: 0 36px 0 14px; border: 1px solid var(--line-2); border-radius: 8px; background: #fff; font-size: 14px; color: var(--ink); cursor: pointer; }
.sel select:hover { border-color: #c4c9d3; }
.sel > svg { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--muted-2); pointer-events: none; }
.sel.w360 select { width: 360px; }
.sel.sm select { height: 34px; min-width: 130px; font-size: 13.5px; }

.ta { position: relative; border: 1px solid var(--line); border-radius: 10px; background: var(--field); }
.ta:focus-within { border-color: var(--blue-line); background: #fff; }
.ta textarea { display: block; width: 100%; border: 0; background: none; resize: vertical; padding: 12px 14px 4px; font-size: 14px; line-height: 1.75; color: var(--ink); outline: none; min-height: 90px; }
.ta .cnt { text-align: right; padding: 0 12px 8px; font-size: 12.5px; color: var(--muted-2); }
.ta.code textarea { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
.inp { height: 38px; border: 1px solid var(--line); border-radius: 8px; background: var(--field); padding: 0 12px; font-size: 14px; width: 100%; outline: none; }
.inp:focus { border-color: var(--blue-line); background: #fff; }
.row { display: flex; align-items: center; gap: 12px; }
.row.between { justify-content: space-between; }
.lbl { font-size: 14px; color: var(--ink-2); }
.lbl small { color: var(--muted); margin-left: 6px; font-size: 12.5px; }
.q-ic { color: var(--muted-2); display: inline-grid; vertical-align: -3px; margin-left: 4px; cursor: help; }
.link-btn { color: var(--blue); font-size: 13px; }
.link-btn:hover { text-decoration: underline; }

.color { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 12px; border: 1px solid var(--line-2); border-radius: 8px; width: 160px; font-family: ui-monospace, Menlo, monospace; font-size: 13.5px; cursor: pointer; position: relative; }
.color i { width: 20px; height: 20px; border-radius: 4px; border: 1px solid var(--line-2); }
.color input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.range { display: flex; align-items: center; gap: 14px; margin-top: 12px; }
.range input { flex: 1; accent-color: var(--blue); height: 6px; }
.range span { font-size: 13.5px; color: var(--ink-2); white-space: nowrap; width: 110px; }

.qlist { display: grid; gap: 10px; margin-top: 12px; }
.qrow { display: flex; align-items: center; gap: 12px; }
.qrow label { flex: 1; display: flex; align-items: center; height: 38px; border: 1px solid var(--line-2); border-radius: 8px; padding: 0 12px; background: #fff; }
.qrow label:focus-within { border-color: var(--blue-line); }
.qrow input { flex: 1; min-width: 0; border: 0; outline: none; font-size: 14px; background: none; }
.qrow em { font-style: normal; font-size: 12.5px; color: var(--muted-2); margin-left: 8px; }
.minus { width: 24px; height: 24px; display: grid; place-items: center; color: var(--muted); border-radius: 50%; }
.minus:hover { color: #d23b3b; }
.adder { display: inline-flex; align-items: center; gap: 6px; margin-top: 12px; color: var(--blue); font-size: 14px; }
.adder small { color: var(--muted); margin-left: 6px; font-size: 13px; }

.subh { font-size: 15px; font-weight: 600; margin-top: 4px; }
.cards { display: grid; gap: 10px; margin-top: 12px; }
.card { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border: 1px solid var(--line); border-radius: 10px; background: #fafbfc; }
.card:hover { border-color: #d4d8e0; }
.card .cm { flex: 1; min-width: 0; }
.card .cm b { font-size: 14.5px; font-weight: 500; display: flex; align-items: center; gap: 8px; }
.card .cm p { font-size: 12.5px; color: var(--muted); margin-top: 3px; line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 400; }
.card .srcb { display: inline-flex; align-items: center; gap: 4px; height: 26px; padding: 0 8px; border: 1px solid var(--line-2); border-radius: 6px; font-size: 12.5px; color: var(--ink-2); background: #fff; flex: none; }
.card .del { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 6px; color: var(--ink-2); flex: none; }
.card .del:hover { color: #d23b3b; background: #fdeeee; }
.card.tall { align-items: flex-start; }
.card.tall .srcb, .card.tall .del { margin-top: 2px; }
.card .kind { font-size: 11.5px; font-weight: 400; color: #4b6bd8; background: #edf1fe; padding: 1px 6px; border-radius: 4px; }

.sw { position: relative; width: 44px; height: 24px; flex: none; }
.sw input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.sw i { position: absolute; inset: 0; border-radius: 12px; background: #dcdfe5; transition: background .15s; }
.sw i::after { content: ""; position: absolute; left: 3px; top: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, .2); transition: transform .15s; }
.sw input:checked + i { background: var(--blue); }
.sw input:checked + i::after { transform: translateX(20px); }
.sw input:disabled + i { opacity: .55; }

.env { display: grid; grid-template-columns: 1fr 1.3fr 96px 30px; gap: 8px; align-items: center; margin-top: 10px; }
.env .inp { height: 34px; font-size: 13px; font-family: ui-monospace, Menlo, monospace; }
.env .sel select { height: 34px; min-width: 0; width: 100%; font-size: 13px; padding-left: 10px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.chip { height: 30px; padding: 0 12px; border-radius: 15px; border: 1px solid var(--line-2); font-size: 13px; color: var(--ink-2); background: #fff; }
.chip:hover { border-color: var(--blue-line); color: var(--blue); }
.chip.on { background: var(--blue-soft); border-color: var(--blue-line); color: var(--blue); }
.kvrow { display: grid; grid-template-columns: 88px 1fr; gap: 12px; align-items: start; margin-top: 14px; }
.kvrow > span { font-size: 14px; color: var(--ink-2); line-height: 34px; }
.tip { font-size: 12.5px; color: var(--muted); margin-top: 6px; }
.params { display: grid; gap: 14px; margin-top: 12px; }
.param { display: grid; grid-template-columns: 150px 1fr 70px; gap: 14px; align-items: center; }
.param span { font-size: 13.5px; color: var(--ink-2); }
.param span small { display: block; font-size: 12px; color: var(--muted); }
.param input[type=range] { accent-color: var(--blue); }
.param input[type=number] { height: 32px; border: 1px solid var(--line-2); border-radius: 6px; padding: 0 8px; font-size: 13px; width: 70px; }

.acl { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; background: #fafbfc; margin-top: 12px; }
.acl .av { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line-2); display: grid; place-items: center; font-size: 16px; background: #fff; flex: none; }
.acl .cm { flex: 1; }
.acl .cm b { font-weight: 500; font-size: 14.5px; }
.acl .cm p { font-size: 12.5px; color: var(--muted); }
.acl .role { height: 28px; padding: 0 12px; border-radius: 14px; background: var(--blue); color: #fff; font-size: 12.5px; display: inline-flex; align-items: center; }
.acl .sel select { height: 30px; min-width: 110px; font-size: 13px; }

/* ---------- 调试预览 ---------- */
.pv { position: relative; display: flex; flex-direction: column; min-width: 0; background: #fff; }
.pv-head { display: flex; align-items: center; justify-content: space-between; padding: 30px 0 0 36px; }
.pv-head h2 { font-size: 17px; font-weight: 600; }
.pv-tools { display: flex; gap: 6px; padding: 6px 12px; background: #fff; border: 1px solid var(--line); border-right: 0; border-radius: 24px 0 0 24px; }
.pv-tools button { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 8px; color: var(--ink-2); }
.pv-tools button:hover { background: var(--bg); color: var(--ink); }
.chat { flex: 1; overflow: auto; padding: 40px 36px 20px; display: flex; flex-direction: column; gap: 12px; }
.bubble { max-width: 100%; align-self: flex-start; background: #f6f7f9; border-radius: 12px; padding: 14px 18px; font-size: 14.5px; line-height: 1.8; color: var(--ink); white-space: pre-wrap; }
.bubble.me { align-self: flex-end; background: var(--blue); color: #fff; max-width: 70%; }
.bubble.card { display: flex; gap: 12px; border: 1px solid var(--line); }
.bubble.card .avatar { width: 36px; height: 36px; }
.bubble.card b { display: block; margin-bottom: 2px; }
.sugs { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; }
.sug { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 9px 18px; font-size: 14px; color: var(--ink); text-align: left; }
.sug:hover { border-color: var(--blue-line); color: var(--blue); }
.trace { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; font-size: 13px; color: var(--ink-2); align-self: flex-start; min-width: 320px; }
.trace summary { cursor: pointer; color: var(--muted); list-style: none; display: flex; align-items: center; gap: 6px; }
.trace summary::-webkit-details-marker { display: none; }
.trace li { display: flex; gap: 8px; align-items: center; padding: 4px 0; }
.trace li em { font-style: normal; font-size: 11.5px; padding: 0 6px; border-radius: 4px; background: #edf1fe; color: #4b6bd8; }
.trace li em.sk { background: #f3ecfc; color: #8a4bd0; }
.trace li em.kb { background: #e7f6ee; color: #1c8a52; }
.trace li em.ag { background: #fdf0e6; color: #c2560c; }
.trace li em.ok { background: #fff6e0; color: #a86b00; }
.dots3 { display: inline-flex; gap: 4px; }
.dots3 i { width: 6px; height: 6px; border-radius: 50%; background: #b3b9c4; animation: blink 1s infinite; }
.dots3 i:nth-child(2) { animation-delay: .2s; }
.dots3 i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 50% { opacity: .25; } }
.composer { margin: 0 36px; background: #fff; border: 1px solid var(--line-2); border-radius: 14px; padding: 14px 16px 12px 22px; box-shadow: 0 2px 8px rgba(20, 30, 50, .04); }
.composer textarea { width: 100%; border: 0; outline: none; resize: none; font-size: 14.5px; height: 44px; background: none; }
.composer .crow { display: flex; align-items: center; gap: 10px; }
.composer .crow .sp { flex: 1; }
.cbtn { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; color: var(--ink-2); }
.cbtn:hover { background: var(--bg); }
.cbtn.think { width: auto; padding: 0 12px; border-radius: 18px; height: 30px; font-size: 13px; gap: 4px; display: inline-flex; align-items: center; border: 1px solid var(--line-2); }
.cbtn.think.on { background: var(--blue-soft); border-color: var(--blue-line); color: var(--blue); }
.send { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--blue); color: #fff; }
.send:disabled { background: #9db1f3; opacity: 1; }
.pv-foot { text-align: center; font-size: 13px; color: var(--muted-2); padding: 16px 0 18px; }
.float-bot { position: absolute; right: 22px; bottom: 150px; width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; color: #fff; background: radial-gradient(circle at 35% 30%, #8fb0ff, #3a5ee8 70%); box-shadow: 0 6px 20px rgba(60, 90, 230, .35), 0 0 0 6px rgba(140, 170, 255, .18); }

/* ---------- 分析 ---------- */
.ana { grid-column: 1 / -1; overflow: auto; padding: 32px 40px; background: var(--bg); }
.ana h2 { font-size: 17px; margin-bottom: 16px; }
.mgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.mbox { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; }
.mbox b { display: block; font-size: 24px; font-weight: 600; }
.mbox span { font-size: 13px; color: var(--muted); }
.ana-empty { margin-top: 18px; background: #fff; border: 1px dashed var(--line-2); border-radius: 10px; padding: 48px; text-align: center; color: var(--muted); }

/* ---------- 弹窗 ---------- */
.mask { position: fixed; inset: 0; background: rgba(20, 26, 38, .38); display: grid; place-items: center; z-index: 50; }
.dlg { width: min(640px, calc(100% - 32px)); max-height: calc(100vh - 80px); display: flex; flex-direction: column; background: #fff; border-radius: 12px; box-shadow: 0 20px 50px rgba(0, 0, 0, .18); }
.dlg header { display: flex; align-items: center; padding: 18px 22px 12px; }
.dlg header h3 { flex: 1; font-size: 16px; }
.dlg .dsearch { margin: 0 22px 10px; display: flex; align-items: center; gap: 8px; height: 38px; border: 1px solid var(--line-2); border-radius: 8px; padding: 0 12px; color: var(--muted); }
.dlg .dsearch input { flex: 1; border: 0; outline: none; font-size: 14px; color: var(--ink); }
.dlg .dnote { margin: 0 22px 8px; font-size: 12.5px; color: var(--muted); }
.dlg .dfilter { margin: 0 22px 10px; display: flex; flex-wrap: wrap; gap: 6px; }
.dlg .dfilter .chip { height: 26px; font-size: 12.5px; padding: 0 10px; }
.dlg .dbody { overflow: auto; padding: 0 22px; flex: 1; }
.pick { display: flex; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px; cursor: pointer; align-items: flex-start; }
.pick:hover { border-color: #cfd5df; }
.pick input { margin-top: 4px; accent-color: var(--blue); }
.pick b { font-weight: 500; font-size: 14px; }
.pick p { font-size: 12.5px; color: var(--muted); margin-top: 2px; line-height: 1.55; }
.pick small { font-size: 11.5px; color: var(--muted); margin-left: 6px; font-weight: 400; }
.pick.dis { opacity: .55; cursor: default; }
.dlg footer { display: flex; align-items: center; gap: 10px; padding: 14px 22px 18px; border-top: 1px solid var(--line); margin-top: 8px; }
.dlg footer .note { flex: 1; font-size: 12.5px; color: var(--muted); }
.form { padding: 0 22px 6px; display: grid; gap: 14px; overflow: auto; }
.form label { display: grid; gap: 6px; font-size: 13.5px; color: var(--ink-2); }
.form textarea { border: 1px solid var(--line-2); border-radius: 8px; padding: 8px 12px; min-height: 70px; resize: vertical; outline: none; }
.checklist { display: grid; gap: 6px; font-size: 13px; background: var(--field); border-radius: 8px; padding: 10px 14px; }
.checklist li { display: flex; gap: 8px; align-items: center; }
.checklist li.bad { color: #c2410c; }
.checklist li.good { color: #1c8a52; }
.toast { position: fixed; left: 50%; top: 76px; transform: translateX(-50%); background: #1f2329; color: #fff; padding: 9px 18px; border-radius: 8px; font-size: 13.5px; z-index: 80; box-shadow: 0 8px 24px rgba(0, 0, 0, .18); }

/* 补充 */
.main.wide { grid-template-columns: 0 0 1fr; }
.main.wide .cfg, .main.wide .splitter { visibility: hidden; overflow: hidden; }
.ana { height: calc(100vh - 62px); }
.menu .hrow b { display: flex; gap: 8px; align-items: center; font-weight: 600; }
.menu .hrow b small { display: inline; color: var(--blue); font-weight: 400; }
.menu .hrow span { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
.btn.danger { background: #d23b3b; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
pre.yaml { margin: 0 22px; max-height: 56vh; overflow: auto; background: #f7f8fa; border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; font: 12.5px/1.7 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; }

  </style>
</head>
<body>
<!--
  科研智能体配置页（独立页面）
  1. 从「科研智能体.html」点「新建智能体」进入；左侧是配置，右侧是调试预览，配置改动实时反映到预览。
  2. 可选的技能、工具、MCP 服务器、可调用的科研智能体来自科研技能 / 科学工具箱 / 科研智能体页面的条目（见底部 CATALOG）。
  3. 点「发布」通过检查后，带 #created=<配置 JSON> 回到科研智能体页面，新条目出现在「我创建的」。
  4. 视觉参考用户提供的智能体配置截图（配置 / 分析、基础设置、能力扩展、高级设置、权限设置）。
-->
<header class="top">
  <div class="top-l">
    <a class="back" href="科研智能体.html" id="back" aria-label="返回科研智能体" data-icon="back" data-size="22"></a>
    <button class="avatar" type="button" id="avatar" title="更换图标"></button>
    <div class="title-box">
      <div class="title-row" id="title-row"></div>
      <div class="badges"><span class="badge"><span data-icon="bot" data-size="14"></span>科研智能体</span><span class="badge gray" id="pub-badge">未发布</span></div>
    </div>
  </div>
  <div class="seg" role="tablist"><button type="button" class="on" data-mode="cfg">配置</button><button type="button" data-mode="ana">分析</button></div>
  <div class="top-r">
    <button class="icon-btn" type="button" data-menu="hist-menu" title="版本记录" style="width:34px;height:34px"><span data-icon="history" data-size="20"></span></button>
    <button class="btn lg" type="button" id="publish"><span data-icon="send" data-size="17"></span>发布</button>
    <button class="icon-btn" type="button" data-menu="more-menu" title="更多" style="width:34px;height:34px"><span data-icon="dots" data-size="20"></span></button>
  </div>
  <div class="menu" id="hist-menu" style="right:150px;width:260px" hidden>
    <div class="mh">版本记录</div>
    <div id="hist-list"></div>
  </div>
  <div class="menu" id="more-menu" hidden>
    <button type="button" data-more="yaml"><span data-icon="doc" data-size="16"></span>查看 agent.yaml</button>
    <button type="button" data-more="template"><span data-icon="spark" data-size="16"></span>用示例填充（材料研发助手）</button>
    <button type="button" data-more="reset" class="danger"><span data-icon="trash" data-size="16"></span>清空草稿</button>
  </div>
</header>

<main class="main" id="main">
  <section class="cfg" id="cfg" aria-label="配置"></section>
  <div class="splitter" id="splitter" title="拖动调整宽度"></div>
  <section class="pv" aria-label="调试预览">
    <div class="pv-head">
      <h2>调试预览</h2>
      <div class="pv-tools">
        <button type="button" data-pv="new" title="新会话"><span data-icon="chatplus" data-size="20"></span></button>
        <button type="button" data-pv="clear" title="清空对话"><span data-icon="brush" data-size="20"></span></button>
        <button type="button" data-pv="wide" title="收起配置栏"><span data-icon="sidebar" data-size="20"></span></button>
      </div>
    </div>
    <div class="chat" id="chat"></div>
    <div class="composer">
      <textarea id="pv-q" placeholder="输入你的问题" aria-label="输入你的问题"></textarea>
      <div class="crow">
        <button class="cbtn" type="button" data-pv="attach" title="上传文件"><span data-icon="plus" data-size="20"></span></button>
        <span id="think-slot"></span>
        <span class="sp"></span>
        <button class="cbtn" type="button" data-pv="mic" title="语音输入"><span data-icon="mic" data-size="19"></span></button>
        <button class="send" type="button" id="pv-send" title="发送" disabled><span data-icon="up" data-size="19"></span></button>
      </div>
    </div>
    <p class="pv-foot">当前为应用调试环境，发布后在科研超级中枢由 Research Agent 分派或 @名称 调用即可体验发布效果</p>
    <button class="float-bot" type="button" data-pv="bot" title="智能体助手：根据描述帮你生成配置"><span data-icon="bot" data-size="26"></span></button>
  </section>
  <section class="ana" id="ana" hidden></section>
</main>
<div class="mask" id="mask" hidden></div>
<div class="toast" id="toast" hidden></div>

function icon(name, size, sw) {
  const s = size || 18
  return `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw || 1.7}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name] || ICONS.spark}</svg>`
}
function paintIcons(root) {
  root.querySelectorAll("[data-icon]").forEach((el) => { el.innerHTML = icon(el.dataset.icon, +el.dataset.size || 18); el.style.display = el.style.display || "inline-grid" })
}
function esc(v) { return String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])) }
let toastTimer = 0
function toast(text) {
  const t = document.getElementById("toast")
  t.textContent = text
  t.hidden = false
  clearTimeout(toastTimer)
  toastTimer = setTimeout(() => { t.hidden = true }, 2600)
}

function hexA(hex, a) {
  const m = /^#?([0-9a-f]{6})$/i.exec(hex || "")
  if (!m) return "#fff"
  const n = parseInt(m[1], 16)
  return `rgba(${n >> 16}, ${(n >> 8) & 255}, ${n & 255}, ${a / 100})`
}

function overlap(q, name) {
  const words = name.replace(/[（）()·/、]/g, " ").split(/\s+/).filter(Boolean)
  return words.some((w) => w.length >= 2 && [...Array(Math.max(1, w.length - 1)).keys()].some((i) => q.includes(w.slice(i, i + 2))))
}
function mockReply(q) {
  const d = draft
  const trace = []
  if (thinkOn && d.think) trace.push(["ok", "思考", "拆解问题、确定需要的信息与步骤"])
  if (d.web && /近|最新|今年|趋势|新闻|\d{4}/.test(q)) trace.push(["", "联网搜索", `搜索「${q.slice(0, 18)}」相关的最新信息`])
  d.kbs.forEach((k) => { if (overlap(q, k) || d.kbs.length === 1) trace.push(["kb", "知识库", `检索「${k}」，命中 ${3 + (k.length % 4)} 个片段`]) })
  const sk = d.skills.filter((s) => overlap(q, s))
  const skill = sk[0] || (d.skills.length ? d.skills[0] : null)
  if (skill) trace.push(["sk", "技能", `读取「${skill}」的 SKILL.md，按其步骤执行`])
  const caps = [...d.mcps, ...d.tools].filter((t) => overlap(q, t)).slice(0, 2)
  if (!caps.length && [...d.mcps, ...d.tools].length) caps.push([...d.mcps, ...d.tools][0])
  caps.forEach((t) => trace.push(["", d.mcps.includes(t) ? "MCP" : "工具", t === "远程计算" ? "估算核时，调试环境不真正提交作业" : `调用「${t}」`]))
  if (d.agentType === "团队智能体" && d.subAgents.length) {
    const a = d.subAgents.find((x) => overlap(q, x)) || d.subAgents[0]
    trace.push(["ag", "分派", `把子任务交给「${a}」执行并汇总结果`])
  }
  if (d.confirm.length && caps.some((t) => t === "远程计算")) trace.push(["ok", "确认", `${d.confirm[0]}请用户确认`])
  if (d.guards.length) trace.push(["ok", "护栏", `${d.guards.join("、")}：通过`])
  const lines = []
  if (!d.prompt.trim()) lines.push("（提示词还是空的，下面的回复只基于模型默认行为。）")
  lines.push(`收到。关于「${q}」，我会这样处理：`)
  if (skill) lines.push(`按「${skill}」的步骤${caps.length ? `，调用 ${caps.join("、")}` : ""}完成分析；`)
  else if (caps.length) lines.push(`调用 ${caps.join("、")} 完成分析；`)
  else lines.push("当前没有绑定技能或工具，只能基于提示词和模型给出建议；")
  lines.push("结果会整理成结构化结论，并列出引用来源。")
  lines.push("\n这是调试环境的模拟回复，发布后在科研超级中枢里会真实执行。")
  return { role: "ai", text: lines.join("\n"), trace, open: true }
}
function ask(q) {
  q = q.trim()
  if (!q || busy) return
  chat.forEach((m) => { m.open = false })
  chat.push({ role: "me", text: q })
  chat.push({ role: "ai", pending: true })
  busy = true
  document.getElementById("pv-q").value = ""
  renderChat()
  setTimeout(() => {
    chat.pop()
    chat.push(mockReply(q))
    busy = false
    renderChat()
  }, 650)
}

function section(text, head) {
  const re = new RegExp(`^##\\s*${head}[^\\n]*\\n([\\s\\S]*?)(?=^##\\s|$(?![\\s\\S]))`, "m")
  const m = re.exec(text)
  return m ? m[1].split("\n").map((s) => s.replace(/^\s*(?:[-*]|\d+[.、)])\s*/, "").trim()).filter(Boolean) : []
}
function skillDeps() {
  // 技能依赖的工具需在工具箱中存在；这里只提示技能引用了但智能体没有添加的 MCP 服务 / 工具
  const have = new Set([...draft.mcps, ...draft.tools])
  const miss = []
  draft.skills.forEach((n) => { const s = findBy(CATALOG.skills, n); (s.t || []).forEach((t) => { if (!have.has(t) && !miss.includes(t)) miss.push(t) }) })
  return miss
}
function checks() {

  const nameOk = d.name.trim() && d.name !== "未命名科研智能体"

    [nameOk, nameOk ? `名称：${d.name}` : "请修改默认名称（点标题旁的编辑按钮）"],
    [d.prompt.trim().length >= 20, d.prompt.trim().length >= 20 ? `提示词 ${d.prompt.length} 字` : "提示词至少 20 字，说明它的职责、工作流程和执行边界"],
    [d.scenes.length > 0, d.scenes.length ? `分类：${d.field}${d.dirs.length ? " · " + d.dirs.join("、") : ""} · ${d.scenes.join("、")}` : "请在「描述与分类」里至少选择一个应用场景"],
    [caps > 0, caps ? `能力：技能 ${d.skills.length} · 工具 ${d.tools.length} · MCP ${d.mcps.length}${d.agentType === "团队智能体" ? ` · 科研智能体 ${d.subAgents.length}` : ""}` : "请至少添加一个技能、工具或 MCP 服务器"],
    [d.agentType !== "团队智能体" || d.subAgents.length > 0, d.agentType === "团队智能体" && !d.subAgents.length ? "团队智能体需要至少一个可调用的科研智能体" : `类型：${d.agentType} · ${d.auto}`]

// 配置 / 分析
document.querySelector(".seg").addEventListener("click", (e) => {
  const b = e.target.closest("[data-mode]")
  if (!b) return
  mode = b.dataset.mode
  document.querySelectorAll(".seg button").forEach((x) => x.classList.toggle("on", x === b))
  const ana = mode === "ana"
  document.getElementById("main").hidden = ana
  document.getElementById("ana").hidden = !ana
  if (ana) renderAna()
})
// 分析区在 main 外无法显示，挂到 body 下
document.body.insertBefore(document.getElementById("ana"), document.getElementById("mask"))

// 顶部菜单
function closeMenus() { document.querySelectorAll(".menu").forEach((m) => { m.hidden = true }) }
document.addEventListener("click", (e) => {
  const mb = e.target.closest("[data-menu]")
  if (mb) {
    const m = document.getElementById(mb.dataset.menu)
    const open = m.hidden
    closeMenus()
    if (open) {
      if (m.id === "hist-menu") document.getElementById("hist-list").innerHTML = pubLog.length ? pubLog.map((h, i) => `<div class="hrow"><b>${esc(h.ver)}${i === 0 ? "<small>当前</small>" : ""}</b><span>${esc(h.at)} · ${esc(h.note)}</span></div>`).join("") : `<p class="none" style="padding:10px 14px">还没有发布记录。发布后每个版本会记在这里。</p>`
      m.hidden = false
    }
    return
  }
  if (!e.target.closest(".menu")) closeMenus()
})
document.getElementById("more-menu").addEventListener("click", (e) => {
  const b = e.target.closest("[data-more]")
  if (!b) return
  closeMenus()
  const k = b.dataset.more
  if (k === "yaml") dialog("agent.yaml", `<pre class="yaml">${esc(yaml())}</pre>`, `<span class="note">发布时按此配置生成，密钥类环境变量只记录名称</span><button class="btn" type="button" data-close>关闭</button>`)
  else if (k === "template") { const keep = { acl: draft.acl, visibility: draft.visibility }; draft = Object.assign(blankDraft(), JSON.parse(JSON.stringify(SAMPLE)), keep); chat = []; touch(); renderAll(); toast("已用「材料研发助手」示例填充，可在此基础上修改") }
  else if (k === "reset") {
    dialog("清空草稿", `<div class="form"><p>清空后，当前的所有配置和调试对话都会丢失${published ? "（已发布的版本不受影响）" : ""}。</p></div>`, `<span class="note"></span><button class="btn ghost" type="button" data-close>取消</button><button class="btn danger" type="button" data-reset-ok>清空</button>`)
  }
})

// 发布
document.getElementById("publish").addEventListener("click", openPublish)

// 弹窗
const mask = document.getElementById("mask")
mask.addEventListener("click", (e) => {
  if (e.target === mask || e.target.closest("[data-close]")) { closeMask(); return }
  const f = e.target.closest("[data-pkf]")
  if (f) { picking.f = f.dataset.pkf; paintPicker(); return }
  if (e.target.closest("[data-pk-ok]")) { applyPicker(); return }
  if (e.target.closest("[data-pub-ok]")) { doPublish(); return }
  if (e.target.closest("[data-guard-ok]")) { draft.guardAction = document.getElementById("g-act").value; closeMask(); touch(); renderCfg(); return }
  if (e.target.closest("[data-reset-ok]")) { draft = blankDraft(); chat = []; dirty = false; closeMask(); renderAll(); paintPublishBadge(); toast("草稿已清空"); return }
  if (e.target.closest("[data-leave-ok]")) { location.href = "科研智能体.html"; return }
  if (e.target.closest("[data-bot-ok]")) { applyBot(); return }
})
mask.addEventListener("input", (e) => {
  if (e.target.id === "pk-q") {
    picking.q = e.target.value
    const pos = e.target.selectionStart
    paintPicker()
    const i = document.getElementById("pk-q"); i.focus(); i.setSelectionRange(pos, pos)
  }
})
mask.addEventListener("change", (e) => {
  const c = e.target.closest("[data-pk]")
  if (!c) return
  if (c.checked) picking.sel.add(c.dataset.pk); else picking.sel.delete(c.dataset.pk)
  document.getElementById("pk-note").textContent = `已选 ${picking.sel.size} 个`
})
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !mask.hidden) closeMask() })

// 返回：有未发布的修改时确认
document.getElementById("back").addEventListener("click", (e) => {
  if (!dirty) return
  e.preventDefault()
  dialog("离开配置页", `<div class="form"><p>${published ? "有修改还没有发布，" : "这个科研智能体还没有发布，"}离开后当前配置会丢失。</p></div>`,
    `<span class="note"></span><button class="btn ghost" type="button" data-close>继续编辑</button><button class="btn danger" type="button" data-leave-ok>离开</button>`)
})

// 拖动分隔条
;(function splitter() {
  const sp = document.getElementById("splitter")
  const main = document.getElementById("main")
  let on = false
  sp.addEventListener("mousedown", (e) => { on = true; e.preventDefault(); document.body.style.cursor = "col-resize" })
  document.addEventListener("mousemove", (e) => {
    if (!on) return
    const w = Math.max(520, Math.min(e.clientX - main.getBoundingClientRect().left, main.clientWidth - 380))
    main.style.setProperty("--lw", w + "px")
  })
  document.addEventListener("mouseup", () => { on = false; document.body.style.cursor = "" })
})()

// 调试预览
const pvq = document.getElementById("pv-q")
pvq.addEventListener("input", () => { document.getElementById("pv-send").disabled = busy || !pvq.value.trim() })
pvq.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); ask(pvq.value) } })
document.getElementById("pv-send").addEventListener("click", () => ask(pvq.value))
document.querySelector(".pv").addEventListener("click", (e) => {
  const s = e.target.closest("[data-sug]")
  if (s) { ask(s.dataset.sug); return }
  const b = e.target.closest("[data-pv]")
  if (!b) return
  const k = b.dataset.pv
  if (k === "new" || k === "clear") { if (busy) return; chat = []; renderChat(); toast(k === "new" ? "已开始新会话" : "对话已清空") }
  else if (k === "wide") { const m = document.getElementById("main"); m.classList.toggle("wide"); b.title = m.classList.contains("wide") ? "展开配置栏" : "收起配置栏" }
  else if (k === "think") { thinkOn = !thinkOn; renderChat() }
  else if (k === "attach") toast(draft.sessionKb ? "调试环境不上传文件；发布后上传的文件会进入会话知识库" : "调试环境不上传文件；发布后上传的文件只存放在沙箱中")
  else if (k === "mic") toast("调试环境不支持语音输入")
  else if (k === "bot") openBot()
})

// 智能体助手：只根据描述生成提示词、欢迎语和推荐问题；技能 / 工具仍由用户自己添加
function openBot() {
  dialog("智能体助手", `<div class="form">
      <label>描述你想要的科研智能体<textarea id="bot-q" rows="4" placeholder="例如：帮我做催化剂表征数据分析，读 XRD、XPS 结果，给出物相和价态结论，并写成报告">${esc(draft.desc)}</textarea></label>
      <p class="tip">助手会生成名称、提示词、欢迎语和推荐问题并覆盖当前内容；技能、工具和 MCP 服务器请在「能力扩展」里自己添加。</p></div>`,
    `<span class="note"></span><button class="btn ghost" type="button" data-close>取消</button><button class="btn" type="button" data-bot-ok>${icon("spark", 15)}生成</button>`)
}
function applyBot() {
  const q = document.getElementById("bot-q").value.trim()
  if (!q) { toast("先写一句描述"); return }
  const topic = q.replace(/^(帮我|我想|需要|请)?(做|一个|创建)?/, "").split(/[，,。；]/)[0].slice(0, 16) || "科研任务"
  const name = draft.name === "未命名科研智能体" ? `${topic.replace(/(分析|处理)$/, "")}助手`.slice(0, 14) : draft.name
  draft.name = name
  if (!draft.desc) draft.desc = q.slice(0, 80)
  draft.prompt = `你是「${name}」，帮助科研人员完成：${q}

## 核心职责
- 理解用户提供的数据和问题，给出有依据的结论
- 需要计算或检索时调用已配置的技能、工具和 MCP 服务器

## 工作流程
1. 确认任务目标、输入数据和期望的交付物
2. 检查数据完整性，缺失时先向用户说明
3. 按任务调用技能和工具完成分析
4. 汇总结论，列出依据和引用来源

## 执行边界
- 不编造数据和文献，无法确定时明确说明
- 提交计算作业、覆盖数据前先请用户确认`
  draft.welcome = `你好，我是${name}。可以帮你${q.replace(/^(帮我|我想|需要|请)/, "").slice(0, 40)}。把数据或问题发给我吧。`
  draft.questions = [`${topic}一般分几步做？`, "我需要准备哪些输入数据？", "帮我看看这份数据有没有问题"]
  closeMask(); touch(); renderAll(); toast("已生成提示词、欢迎语和推荐问题")
}

function renderAll() { renderTitle(false); renderCfg(); renderChat() }
paintIcons(document)
renderAll()
paintPublishBadge()

</script>

<script>(function(){var b=document.getElementById("back");if(b){b.addEventListener("click",function(e){e.preventDefault();try{var n=parent.document.getElementById("nav-space-act");if(n)n.click();}catch(_){}}); }})();</script>
</body>
