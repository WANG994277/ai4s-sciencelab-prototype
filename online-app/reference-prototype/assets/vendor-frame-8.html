/* ---------- 发布前检查 ---------- */
function checkFlow() {
  const items = [] // [level: err|warn|ok, text, nodeId]
  const s = F.nodes.find((n) => n.type === "start"), e = F.nodes.find((n) => n.type === "end")
  if (!s || !e) items.push(["err", "缺少开始或结束节点"])
  if (s) {
    const vs = s.data.vars
    if (!vs.filter((v) => v.name).length) items.push(["warn", "开始节点没有输入变量，工具将不接受任何参数", s.id])
    const seen = {}
    vs.forEach((v) => {
      if (!/^[A-Za-z_][\w]{0,39}$/.test(v.name)) items.push(["err", `输入变量名「${v.name || "空"}」不合法：只能用字母、数字和下划线`, s.id])
      else if (seen[v.name]) items.push(["err", `输入变量「${v.name}」重复`, s.id])
      seen[v.name] = 1
      if (v.name && !v.desc) items.push(["warn", `输入变量「${v.name}」没有说明，AI 可能传错参数`, s.id])
    })
  }
  if (e && !e.data.outputs.filter((o) => o.name && o.ref).length) items.push(["err", "结束节点还没有配置输出", e.id])
  if (e) e.data.outputs.forEach((o) => { if (o.name && !o.ref) items.push(["err", `返回字段「${o.name}」未映射变量`, e.id]); if (!o.name && o.ref) items.push(["err", "结束节点有未命名的返回字段", e.id]) })
  F.nodes.forEach((n) => {
    if (s && n.id !== s.id && !reaches(s.id, n.id)) items.push(["err", `「${n.title}」没有连到开始节点`, n.id])
    else if (e && n.id !== e.id && !reaches(n.id, e.id)) items.push(["err", `「${n.title}」没有连到结束节点`, n.id])
    const d = n.data
    if (n.type === "agent") { if (d.src === "custom" && !d.model) items.push(["err", `「${n.title}」未选择模型`, n.id]); if (d.src === "exist" && !d.agent) items.push(["err", `「${n.title}」未选择智能体`, n.id]) }
    if ((n.type === "tool" || n.type === "loop") && !d.tool) items.push(["err", `「${n.title}」未选择工具`, n.id])
    if (n.type === "loop" && !d.list) items.push(["err", `「${n.title}」未选择遍历列表`, n.id])
    if (n.type === "http" && !/^https?:\/\//.test(d.url)) items.push(["err", `「${n.title}」URL 需以 http(s):// 开头`, n.id])
    if (n.type === "kb" && !d.query) items.push(["err", `「${n.title}」未填写检索内容`, n.id])
    if (n.type === "if") {
      if (!d.conds.some((c) => c.ref)) items.push(["err", `「${n.title}」未设置条件`, n.id])
      ;["if", "else"].forEach((p) => { if (!F.edges.some((x) => x.from === n.id && x.port === p)) items.push(["warn", `「${n.title}」的 ${p.toUpperCase()} 分支没有连线`, n.id]) })
    }
    // 引用检查
    const ok = new Set(varsFor(n.id).map((v) => v.ref).concat(SYS_VARS.map((x) => x[0])))
    if (n.type === "loop") ok.add(d.item || "item")
    const refs = []
    const walk = (v) => { if (typeof v === "string") refs.push(...refsIn(v)); else if (v && typeof v === "object") Object.entries(v).forEach(([k, x]) => { if (k === "ref" || k === "list") { if (x) refs.push(x) } else walk(x) }) }
    walk(d)
    Array.from(new Set(refs)).forEach((r) => { if (!ok.has(r)) items.push(["err", `「${n.title}」引用了不可用的变量 {{${r}}}`, n.id]) })
  })
  if (!F.tested) items.push(["warn", "尚未试运行成功，建议先点「预览」跑一遍"])
  return items
}
function checklistHtml(items) {
  const errs = items.filter((x) => x[0] === "err"), warns = items.filter((x) => x[0] === "warn")
  if (!items.length) return `<ul class="checklist"><li class="good">${icon("checkc", 16)}检查通过：节点连线和配置完整</li></ul>`
  return `<ul class="checklist">${errs.concat(warns).map(([l, t, id]) => `<li class="${l === "err" ? "bad" : ""}">${icon(l === "err" ? "warn" : "info", 15)}<span class="grow">${esc(t)}</span>${id ? `<button class="link" type="button" data-locate="${id}">定位</button>` : ""}</li>`).join("")}</ul>`
}
function locate(id) {
  $("#mask").hidden = true
  const n = nodeById(id); if (!n) return
  selectNode(id)
  const r = $("#canvas").getBoundingClientRect()
  F.pan.x = r.width / 2 - (n.x + 125) * F.zoom; F.pan.y = r.height / 2 - (n.y + 50) * F.zoom; applyView()
}
function openCheck() {
  const items = checkFlow(), mask = $("#mask")
  const nErr = items.filter((x) => x[0] === "err").length
  mask.innerHTML = `<div class="dlg" role="dialog" aria-modal="true"><header><h3>发布前检查</h3><button class="icon-btn" type="button" data-close>${icon("close", 18)}</button></header><div class="dbody">${checklistHtml(items)}</div>
    <footer><span class="note">${nErr ? `${nErr} 个问题需要处理后才能发布` : "可以发布"}</span><button class="btn ghost" type="button" data-close>关闭</button>${nErr ? "" : `<button class="btn" type="button" data-top="publish">去发布</button>`}</footer></div>`
  mask.hidden = false
}

/* ---------- 发布 ---------- */
function openPublish() {
  const items = checkFlow(), errs = items.filter((x) => x[0] === "err")
  const mask = $("#mask"), p = F.pub
  if (!p.call) p.call = slug(F.name, "workflow_tool")
  if (errs.length) {
    mask.innerHTML = `<div class="dlg" role="dialog" aria-modal="true"><header><h3>还不能发布</h3><button class="icon-btn" type="button" data-close>${icon("close", 18)}</button></header><div class="dbody"><p class="hint" style="margin-bottom:10px">以下问题处理后才能发布为工具：</p>${checklistHtml(items)}</div>
      <footer><span class="note">${errs.length} 个问题</span><button class="btn" type="button" data-locate="${errs.find((x) => x[2]) ? errs.find((x) => x[2])[2] : ""}">定位第一个问题</button></footer></div>`
    mask.hidden = false; return
  }
  const dirs = DIRS[p.field] || []
  const draw = () => {
    const dirsNow = DIRS[p.field] || []
    mask.innerHTML = `<div class="dlg wide" role="dialog" aria-modal="true"><header><h3>发布为工具${F.published ? `<small class="hint" style="margin-left:8px;font-weight:400">当前 v${F.published.ver}，将发布 v${F.published.ver + 1}</small>` : ""}</h3><button class="icon-btn" type="button" data-close>${icon("close", 18)}</button></header>
      <div class="dbody">${items.length ? checklistHtml(items) : ""}
        <div class="cgrid" style="gap:0 18px"><label class="fl"><span>工具名称<em>*</em></span><input class="inp" id="pb-name" value="${esc(F.name)}" maxlength="40" /></label>
          <label class="fl"><span>调用名<em>*</em><small>AI 调用名 workflow.调用名</small></span><input class="inp mono" id="pb-call" value="${esc(p.call)}" /></label>
          <label class="fl full"><span>给 AI 的说明<em>*</em><small>何时调用、输入什么、返回什么</small></span><textarea class="tx" id="pb-desc" rows="3">${esc(F.desc)}</textarea></label></div>
        <div class="fl"><span>学科领域<em>*</em></span><div class="checks">${FIELDS.map((f) => `<label class="ck${p.field === f ? " on" : ""}"><input type="radio" name="pb-field" value="${f}" ${p.field === f ? "checked" : ""} />${f}</label>`).join("")}</div></div>
        ${dirsNow.length ? `<div class="fl"><span>研究方向<small>可多选</small></span><div class="checks">${dirsNow.map((d) => `<label class="ck${p.dirs.includes(d) ? " on" : ""}"><input type="checkbox" data-pdir="${esc(d)}" ${p.dirs.includes(d) ? "checked" : ""} />${esc(d)}</label>`).join("")}</div></div>` : ""}
        <div class="fl"><span>应用场景<em>*</em><small>至少选一个</small></span><div class="checks">${SCENES.map((s) => `<label class="ck${p.scenes.includes(s) ? " on" : ""}"><input type="checkbox" data-pscene="${s}" ${p.scenes.includes(s) ? "checked" : ""} />${s}</label>`).join("")}</div></div>
        <div class="fl"><span>授权方式</span><div class="checks">${LICENSES.map((l) => `<label class="ck${p.lic === l ? " on" : ""}"><input type="radio" name="pb-lic" value="${l}" ${p.lic === l ? "checked" : ""} />${l}</label>`).join("")}</div></div>
        <div class="fl"><span>发布方式</span>
          <div class="tcard"><div class="grow"><b>MCP 工具</b><small>出现在科学工具箱，加载到空间后 AI 可调用 <code>workflow.${esc(p.call)}</code></small></div><label class="sw"><input type="checkbox" checked disabled /><i></i></label></div>
          <div class="tcard"><div class="grow"><b>HTTP 接口</b><small>供外部系统调用：<code>POST /api/workflow-tools/${esc(p.call)}/run</code>，平台 API Key 鉴权</small></div><label class="sw"><input type="checkbox" id="pb-http" ${p.http ? "checked" : ""} /><i></i></label></div>
          <div class="tcard"><div class="grow"><b>调用前人工确认</b><small>AI 发起调用时先展示参数，用户确认后才执行</small></div><label class="sw"><input type="checkbox" id="pb-confirm" ${p.confirm ? "checked" : ""} /><i></i></label></div></div>
        ${ifaceHtml()}</div>
      <footer><span class="note">发布后流程版本固定，继续编辑不影响已发布版本</span><button class="btn ghost" type="button" data-close>取消</button><button class="btn" type="button" id="pb-ok">${icon("send", 16)}发布</button></footer></div>`
    paintIcons(mask)
  }
  const sync = () => { F.name = $("#pb-name").value.trim() || F.name; p.call = $("#pb-call").value.trim(); F.desc = $("#pb-desc").value; p.http = $("#pb-http").checked; p.confirm = $("#pb-confirm").checked }
  draw(); mask.hidden = false
  mask.onchange = (ev) => {
    const t = ev.target
    if (!$("#pb-name")) return
    if (t.name === "pb-field") { sync(); p.field = t.value; p.dirs = []; draw(); return }
    if (t.name === "pb-lic") { p.lic = t.value; $$("input[name=pb-lic]", mask).forEach((r) => r.closest(".ck").classList.toggle("on", r.checked)); return }
    if (t.dataset.pdir) { const a = p.dirs; t.checked ? a.push(t.dataset.pdir) : a.splice(a.indexOf(t.dataset.pdir), 1); t.closest(".ck").classList.toggle("on", t.checked) }
    if (t.dataset.pscene) { const a = p.scenes; t.checked ? a.push(t.dataset.pscene) : a.splice(a.indexOf(t.dataset.pscene), 1); t.closest(".ck").classList.toggle("on", t.checked) }
  }
  mask.onclick = (ev) => {
    if (!ev.target.closest("#pb-ok")) return
    sync()
    if (!F.name) { toast("请填写工具名称"); return }
    if (!/^[a-z][a-z0-9_]{1,39}$/.test(p.call)) { toast("调用名只能用小写字母、数字和下划线，且以字母开头"); return }
    if (!F.desc.trim()) { toast("请填写给 AI 的说明"); return }
    if (!p.scenes.length) { toast("请至少选择一个应用场景"); return }
    doPublish()
  }
}
function flowPayload() {
  const s = F.nodes.find((n) => n.type === "start"), e = F.nodes.find((n) => n.type === "end"), p = F.pub
  return {
    kind: "workflow", id: "new-" + Date.now(), name: F.name, call: "workflow." + p.call, field: p.field, dirs: p.field === "通用" ? [] : p.dirs,
    scenes: p.scenes, license: p.lic, desc: F.desc.trim(),
    inputs: s.data.vars.filter((v) => v.name).map((v) => ({ name: v.name, type: v.type, required: !!v.req, desc: v.desc || "" })),
    outputs: e.data.outputs.filter((o) => o.name).map((o) => o.name),
    nodes: F.nodes.length, tools: Array.from(new Set(F.nodes.flatMap((n) => [n.data.tool].concat(n.data.tools || [])).filter(Boolean))),
    http: p.http ? `/api/workflow-tools/${p.call}/run` : "", confirm: p.confirm, version: F.published ? F.published.ver : 1
  }
}
function doPublish() {
  F.published = { ver: F.published ? F.published.ver + 1 : 1, time: nowText() }
  snapshot(`发布 v${F.published.ver}`)
  renderTop()
  const mask = $("#mask")
  mask.onchange = null; mask.onclick = null
  mask.innerHTML = `<div class="dlg" role="dialog" aria-modal="true"><header><h3 style="display:flex;align-items:center;gap:8px;color:#1c8a52">${icon("checkc", 20)}已发布 v${F.published.ver}</h3><button class="icon-btn" type="button" data-close>${icon("close", 18)}</button></header>
    <div class="dbody"><p style="font-size:14px;line-height:1.8">「${esc(F.name)}」已作为工具发布，AI 调用名 <code>workflow.${esc(F.pub.call)}</code>。在课题空间加载后即可被 AI 调用${F.pub.http ? `；外部系统可调用 <code>POST /api/workflow-tools/${esc(F.pub.call)}/run</code>` : ""}。</p>
      ${F.pub.http ? `<pre class="json" style="margin-top:12px">${esc(`curl -X POST https://ai4s.example.org/api/workflow-tools/${F.pub.call}/run \\\n  -H "Authorization: Bearer $AI4S_API_KEY" \\\n  -H "Content-Type: application/json" \\\n  -d '${JSON.stringify(Object.fromEntries(flowPayload().inputs.map((v) => [v.name, v.type.startsWith("array") ? [] : v.type === "number" ? 0 : ""])))}'`)}</pre>` : ""}</div>
    <footer><span class="note"></span><button class="btn ghost" type="button" data-close>继续编辑</button><button class="btn" type="button" id="go-kit">返回科学工具箱</button></footer></div>`
  $("#go-kit").addEventListener("click", () => { location.href = "科学工具箱.html#created=" + encodeURIComponent(JSON.stringify(flowPayload())) })
}

/* ---------- 顶栏 ---------- */
let mode = "custom"
function renderTop() {
  const l = $("#top-l"), r = $("#top-r")
  if (mode === "custom") {
    l.innerHTML = `<a class="back" href="科学工具箱.html" title="返回科学工具箱">${icon("back", 20)}</a><h1>创建自定义工具</h1>`
    r.innerHTML = ""
    return
  }
  l.innerHTML = `<a class="back" href="科学工具箱.html" title="返回科学工具箱">${icon("back", 20)}</a><span class="avatar">${icon("network", 20)}</span>
    <div class="title-box"><div class="title-row" id="title-row"><b>${esc(F.name)}</b><button class="icon-btn" type="button" data-top="rename" title="重命名">${icon("edit", 15)}</button></div>
    <div class="badges"><span class="badge">工具</span>${F.published ? `<span class="badge ok">已发布 v${F.published.ver}</span>` : `<span class="badge gray">未发布</span>`}</div></div>`
  r.innerHTML = `<span class="saved" id="saved">${F.saved ? `草稿自动保存于 ${F.saved}` : "草稿未保存"}</span>
    <button class="icon-btn box" type="button" data-top="hist" title="历史记录">${icon("history", 18)}</button>
    <button class="icon-btn box" type="button" data-top="more" title="更多">${icon("dots", 18)}</button>
    <button class="btn ghost" type="button" data-top="preview">${icon("playc", 16)}预览</button>
    <div class="split"><button class="btn" type="button" data-top="publish">发布</button><button class="btn caret" type="button" data-top="pubmenu" aria-label="更多发布选项">${icon("down", 16, 2)}</button></div>`
}
function toggleMenu(id) { const m = $(id), show = m.hidden; $$(".top .menu").forEach((x) => { x.hidden = true }); m.hidden = !show; if (show) paintIcons(m) }
function renderHist() {
  $("#hist-menu").innerHTML = `<div class="mh">历史记录（最近 15 条）</div>` + (F.hist.length ? F.hist.map((h, i) => `<button type="button" data-hist="${i}">${icon("clock", 15)}<span class="grow">${esc(h.label)}<small>${h.time}</small></span><span class="link">恢复</span></button>`).join("") : `<div class="none">还没有历史记录</div>`)
}
function bindTop() {
  document.querySelector(".top").addEventListener("click", (ev) => {
    const t = ev.target.closest("button"); if (!t) return
    if (t.dataset.mode) { setMode(t.dataset.mode); return }
    const a = t.dataset.top
    if (a === "rename") {
      const row = $("#title-row")
      row.innerHTML = `<input id="name-in" value="${esc(F.name)}" maxlength="40" />`
      const inp = $("#name-in"); inp.focus(); inp.select()
      const done = () => { F.name = inp.value.trim() || F.name; renderTop(); if (!F.sel) renderPanel(); touch("重命名") }
      inp.addEventListener("blur", done); inp.addEventListener("keydown", (e) => { if (e.key === "Enter") inp.blur(); if (e.key === "Escape") { inp.value = F.name; inp.blur() } })
      return
    }
    if (a === "hist") { renderHist(); toggleMenu("#hist-menu"); return }
    if (a === "more") { toggleMenu("#more-menu"); return }
    if (a === "pubmenu") { toggleMenu("#pub-menu"); return }
    if (a === "preview") { openRun(); return }
    if (a === "publish") { openPublish(); return }
    if (t.dataset.hist !== undefined) { const h = F.hist[+t.dataset.hist]; $("#hist-menu").hidden = true; snapshot("恢复前"); restore(h.data); toast(`已恢复到 ${h.time}「${h.label}」`); return }
    const m = t.dataset.more
    if (m) {
      $("#more-menu").hidden = true
      if (m === "sample") { applyTemplate(T_MOL); toast("已填充示例：分子性质批量计算") }
      if (m === "layout") autoLayout()
      if (m === "export") {
        const data = JSON.stringify({ format: "ai4s-workflow-tool", version: 1, name: F.name, desc: F.desc, pub: F.pub, nodes: F.nodes, edges: F.edges }, null, 2)
        const a2 = document.createElement("a"); a2.href = URL.createObjectURL(new Blob([data], { type: "application/json" })); a2.download = slug(F.name, "workflow") + ".workflow.json"; a2.click()
        toast("已导出工作流 JSON")
      }
      if (m === "import") $("#wf-in").click()
      if (m === "reset") { snapshot("清空前"); defaultGraph(); F.sel = null; F.run = null; renderFlow(); requestAnimationFrame(fitView); touch(); toast("已重置为默认流程，可在历史记录中恢复") }
      return
    }
    const pb = t.dataset.pub
    if (pb) { $("#pub-menu").hidden = true; if (pb === "draft") { F.saved = nowText(); snapshot("手动保存草稿"); renderTop(); toast("草稿已保存") } if (pb === "check") openCheck() }
  })
  document.addEventListener("click", (ev) => { if (!ev.target.closest(".top")) $$(".top .menu").forEach((x) => { x.hidden = true }); if (!ev.target.closest(".nmenu, [data-nmore]")) $("#nmenu").hidden = true })
  $("#wf-in").addEventListener("change", (ev) => {
    const f = ev.target.files[0]; ev.target.value = ""
    if (!f) return
    const r = new FileReader()
    r.onload = () => {
      try {
        const d = JSON.parse(String(r.result))
        if (!Array.isArray(d.nodes) || !Array.isArray(d.edges) || !d.nodes.every((n) => NT[n.type] && n.id && n.data)) throw new Error("格式不对")
        snapshot("导入前")
        F.nodes = d.nodes; F.edges = d.edges; F.name = d.name || F.name; F.desc = d.desc || ""; if (d.pub) Object.assign(F.pub, d.pub)
        F.seq = {}; F.nodes.forEach((n) => { const k = +n.id.split("_").pop(); if (!isNaN(k)) F.seq[n.type] = Math.max(F.seq[n.type] ?? -1, k) })
        F.sel = null; F.run = null; F.published = null; F.tested = false
        renderFlow(); requestAnimationFrame(fitView); touch(); toast(`已导入「${F.name}」，${F.nodes.length} 个节点`)
      } catch (e) { toast("无法导入：不是有效的工作流 JSON") }
    }
    r.readAsText(f)
  })
}

/* ---------- 初始化 ---------- */
let flowReady = false
function renderFlow() { renderTop(); renderNodes(); renderPanel(); applyView() }
function setMode(m) {
  mode = m
  $$(".seg button").forEach((b) => b.classList.toggle("on", b.dataset.mode === m))
  $("#custom").hidden = m !== "custom"; $("#flow").hidden = m !== "flow"
  if (location.protocol !== "about:") history.replaceState(null, "", m === "flow" ? "#workflow" : location.pathname + location.search)
  renderTop()
  if (m === "flow") { renderFlow(); if (!flowReady) { flowReady = true; requestAnimationFrame(() => { renderNodes(); fitView() }) } }
}
function bindMask() {
  const mask = $("#mask")
  mask.addEventListener("click", (ev) => {
    if (ev.target === mask || ev.target.closest("[data-close]")) { mask.hidden = true; mask.onclick = null; mask.onchange = null; return }
    const lo = ev.target.closest("[data-locate]"); if (lo) { if (lo.dataset.locate) locate(lo.dataset.locate); else mask.hidden = true; return }
    const tp = ev.target.closest("[data-top=publish]"); if (tp) openPublish()
  })
  document.addEventListener("keydown", (ev) => { if (ev.key === "Escape" && !mask.hidden) { mask.hidden = true; mask.onclick = null; mask.onchange = null } })
}
function init() {
  paintIcons(document)
  bindCustom(); renderCustom()
  defaultGraph(); F.name = "demo"
  bindCanvas(); bindPanel(); bindRun(); bindTop(); bindMask()
  $("#panel").addEventListener("mousedown", (ev) => { if (ev.target.closest("#vpop")) ev.preventDefault() })
  $("#bot").addEventListener("click", openBot)
  window.addEventListener("resize", () => { if (mode === "flow") renderEdges() })
  setMode(/workflow/.test(location.hash) ? "flow" : "custom")
}
init()

</script>
