<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>新建工具 · AI4S</title>
  <style>
:root {
  --blue: #2f5bea;
  --blue-hover: #234bd6;
  --blue-soft: #eef2ff;
  --blue-line: #b9c8f7;
  --ink: #1f2329;
  --ink-2: #3b4250;
  --muted: #7a8190;
  --muted-2: #a2a8b3;
  --line: #e7e9ee;
  --line-2: #dcdfe6;
  --field: #f7f8fa;
  --bg: #f5f6f8;
  --panel: 420px;
  font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", -apple-system, sans-serif;
  color: var(--ink);
  font-size: 14px;
  line-height: 1.5;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #fff; }
body { overflow: hidden; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
button:disabled { cursor: not-allowed; opacity: .5; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
h1, h2, h3, h4, p { margin: 0; }
ul, ol { margin: 0; padding: 0; list-style: none; }
svg { display: block; flex: none; }
a { color: var(--blue); text-decoration: none; }
code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
[hidden] { display: none !important; }

/* ---------- 顶栏 ---------- */
.top { height: 62px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 20px 0 14px; border-bottom: 1px solid var(--line); background: #fff; position: relative; z-index: 15; }
.top-l { display: flex; align-items: center; gap: 12px; min-width: 0; }
.back { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 6px; color: var(--ink); flex: none; }
.back:hover { background: var(--bg); }
.top-l h1 { font-size: 19px; font-weight: 600; letter-spacing: .3px; white-space: nowrap; }
.avatar { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; background: #e9ecf3; color: #4b5566; flex: none; }
.title-box { min-width: 0; }
.title-row { display: flex; align-items: center; gap: 6px; }
.title-row b { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 320px; }
.title-row input { font-size: 15px; font-weight: 600; border: 1px solid var(--blue); border-radius: 6px; padding: 2px 8px; width: 240px; outline: none; }
.icon-btn { width: 26px; height: 26px; display: grid; place-items: center; border-radius: 6px; color: var(--ink-2); }
.icon-btn:hover { background: var(--bg); color: var(--ink); }
.icon-btn.box { width: 36px; height: 36px; border: 1px solid var(--line-2); border-radius: 8px; background: #fff; }
.badges { display: flex; gap: 6px; margin-top: 3px; }
.badge { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 7px; border-radius: 4px; font-size: 12px; color: var(--ink-2); border: 1px solid var(--line-2); background: #fff; }
.badge.gray { background: #eceef2; border-color: #eceef2; color: #5b6270; }
.badge.ok { background: #e7f6ee; border-color: #e7f6ee; color: #1c8a52; }
.seg { display: flex; padding: 3px; border-radius: 8px; background: #f0f1f4; }
.seg button { height: 32px; padding: 0 18px; border-radius: 6px; font-size: 14.5px; color: var(--muted); }
.seg button.on { background: #fff; color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0, 0, 0, .08); }
.top-r { display: flex; align-items: center; justify-content: flex-end; gap: 12px; min-width: 0; }
.saved { font-size: 13.5px; color: var(--muted); white-space: nowrap; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 34px; padding: 0 16px; border-radius: 8px; background: var(--blue); color: #fff; font-size: 14px; font-weight: 500; white-space: nowrap; }
.btn:hover { background: var(--blue-hover); }
.btn.lg { height: 38px; padding: 0 18px; font-size: 15px; }
.btn.ghost { background: #fff; color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--line-2); }
.btn.ghost:hover { background: var(--bg); }
.btn.sm { height: 28px; padding: 0 10px; font-size: 13px; border-radius: 6px; }
.btn.danger { background: #d23b3b; }
.split { display: inline-flex; }
.split .btn:first-child { border-radius: 8px 0 0 8px; }
.split .btn.caret { border-radius: 0 8px 8px 0; padding: 0 10px; margin-left: 1px; }
.menu { position: absolute; top: 56px; right: 20px; background: #fff; border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 30px rgba(20, 30, 50, .12); padding: 6px; min-width: 200px; z-index: 40; }
.menu button { display: flex; width: 100%; align-items: center; gap: 8px; min-height: 34px; padding: 6px 10px; border-radius: 6px; font-size: 13.5px; color: var(--ink-2); text-align: left; }
.menu button:hover { background: var(--bg); }
.menu button.danger { color: #d23b3b; }
.menu .mh { padding: 6px 10px 8px; font-size: 12.5px; color: var(--muted); border-bottom: 1px solid var(--line); margin-bottom: 4px; }
.menu button small { display: block; color: var(--muted); font-size: 12px; }
.menu .none { padding: 8px 10px; font-size: 13px; color: var(--muted); }
.main { height: calc(100vh - 62px); position: relative; }

/* ---------- 通用表单 ---------- */
.inp { height: 38px; border: 1px solid var(--line-2); border-radius: 8px; background: #fff; padding: 0 12px; font-size: 14px; width: 100%; outline: none; }
.inp:focus, .tx:focus { border-color: var(--blue-line); box-shadow: 0 0 0 3px rgba(47, 91, 234, .08); }
.inp.ro { background: var(--field); color: var(--muted); }
.inp.sm { height: 32px; font-size: 13px; padding: 0 10px; border-radius: 6px; }
.tx { width: 100%; border: 1px solid var(--line-2); border-radius: 8px; background: #fff; padding: 9px 12px; font-size: 14px; line-height: 1.7; resize: vertical; outline: none; min-height: 88px; }
.tx.code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; line-height: 1.65; background: #fbfcfd; }
.sel { position: relative; }
.sel select { appearance: none; -webkit-appearance: none; height: 38px; width: 100%; padding: 0 34px 0 12px; border: 1px solid var(--line-2); border-radius: 8px; background: #fff; font-size: 14px; color: var(--ink); cursor: pointer; outline: none; }
.sel.sm select { height: 32px; font-size: 13px; border-radius: 6px; padding-left: 10px; }
.sel > svg { position: absolute; right: 11px; top: 50%; transform: translateY(-50%); color: var(--muted-2); pointer-events: none; }
.fl { display: grid; gap: 7px; margin-bottom: 16px; }
.fl > span { font-size: 14px; color: var(--ink-2); font-weight: 500; }
.fl > span em { font-style: normal; color: #e0503f; margin-left: 2px; }
.fl > span small { font-weight: 400; color: var(--muted); font-size: 12.5px; margin-left: 6px; }
.hint { font-size: 12.5px; color: var(--muted); line-height: 1.6; }
.hint.warn { color: #b26a00; }
.hint.err { color: #c0392b; }
.row { display: flex; align-items: center; gap: 12px; }
.row.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.checks { display: flex; flex-wrap: wrap; gap: 8px; }
.ck { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border: 1px solid var(--line-2); border-radius: 15px; font-size: 13px; color: var(--ink-2); background: #fff; cursor: pointer; user-select: none; }
.ck input { display: none; }
.ck:hover { border-color: var(--blue-line); }
.ck.on { background: var(--blue-soft); border-color: var(--blue-line); color: var(--blue); }
.radios { display: flex; flex-wrap: wrap; gap: 8px 22px; }
.radios label { display: inline-flex; align-items: center; gap: 7px; font-size: 14px; color: var(--ink-2); cursor: pointer; }
.radios input { accent-color: var(--blue); width: 16px; height: 16px; margin: 0; }
.sw { position: relative; width: 40px; height: 22px; flex: none; display: inline-block; }
.sw input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.sw i { position: absolute; inset: 0; border-radius: 11px; background: #dcdfe5; transition: background .15s; }
.sw i::after { content: ""; position: absolute; left: 3px; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, .2); transition: transform .15s; }
.sw input:checked + i { background: var(--blue); }
.sw input:checked + i::after { transform: translateX(18px); }
.link { color: var(--blue); font-size: 13px; }
.link:hover { text-decoration: underline; }
.adder { display: inline-flex; align-items: center; gap: 6px; color: var(--blue); font-size: 13.5px; margin-top: 4px; }
.minus { width: 28px; height: 28px; display: grid; place-items: center; color: var(--muted); border-radius: 6px; flex: none; }
.minus:hover { color: #d23b3b; background: #fdeeee; }
.pill { display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border: 1px solid var(--line-2); border-radius: 12px; font-size: 12.5px; color: var(--ink-2); background: #fff; }
.pill.mono { font-size: 12px; }
.pill.blue { background: var(--blue-soft); border-color: var(--blue-line); color: var(--blue); }
.m { display: inline-grid; place-items: center; min-width: 58px; height: 26px; padding: 0 8px; border-radius: 6px; font-size: 12.5px; font-weight: 600; letter-spacing: .3px; font-family: ui-monospace, Menlo, monospace; }
.m.get { background: #e3f7ea; color: #18864b; }
.m.post { background: #e6eeff; color: #2f5bea; }
.m.put { background: #fff1e0; color: #c26a0a; }
.m.patch { background: #f2eafd; color: #7a45d0; }
.m.delete { background: #fde8e8; color: #c83232; }

/* ---------- 自定义工具：三步向导 ---------- */
.cs { height: 100%; overflow: auto; background: var(--bg); padding: 16px 20px 40px; }
.wiz { max-width: 1360px; margin: 0 auto; background: #fff; border: 1px solid var(--line); border-radius: 10px; }
.steps { display: flex; align-items: center; gap: 16px; padding: 18px 26px; border-bottom: 1px solid var(--line); }
.stp { display: flex; align-items: center; gap: 12px; font-size: 15px; color: var(--muted); }
.stp i { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-style: normal; border: 1.5px solid #c9ced8; color: var(--muted); font-size: 15px; }
.stp.cur { color: var(--ink); font-weight: 600; }
.stp.cur i { border-color: var(--blue); color: var(--blue); font-weight: 500; }
.stp.done { color: var(--ink-2); cursor: pointer; }
.stp.done i { background: var(--blue); border-color: var(--blue); color: #fff; }
.stp-line { width: 100px; height: 1.5px; background: var(--line-2); }
.stp-line.done { background: var(--blue); }
.wbody { padding: 22px 26px 8px; }
.wh h2 { font-size: 18px; font-weight: 600; }
.wh p { font-size: 14px; color: var(--muted); margin-top: 4px; }
.wfoot { display: flex; align-items: center; gap: 10px; padding: 16px 26px; border-top: 1px solid var(--line); position: sticky; bottom: -40px; background: #fff; border-radius: 0 0 10px 10px; }
.wfoot .note { flex: 1; font-size: 13px; color: var(--muted); }
.box { border: 1px solid var(--line); border-radius: 10px; padding: 20px 24px; margin-top: 20px; }
.box > h3 { font-size: 16px; font-weight: 600; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.box > h3 small { font-weight: 400; font-size: 13px; color: var(--muted); }
.box > h3 .sp { flex: 1; }
.info p { margin: 10px 0 0; font-size: 14.5px; color: var(--ink); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.info p b { font-weight: 500; }
.info p span { color: var(--muted); }
.warnbox { display: flex; align-items: center; gap: 12px; padding: 16px 22px; border: 1px solid var(--line); border-radius: 10px; margin-top: 20px; font-size: 15px; }
.warnbox.has { display: block; border-color: #f5d9a8; background: #fffaf0; }
.warnbox.has h4 { display: flex; align-items: center; gap: 8px; font-size: 14.5px; color: #9a5b00; }
.warnbox.has li { font-size: 13.5px; color: #7a4a00; margin-top: 6px; padding-left: 26px; position: relative; }
.warnbox.has li::before { content: ""; position: absolute; left: 10px; top: 9px; width: 5px; height: 5px; border-radius: 50%; background: #d9982d; }
.warnbox.has li code { background: #fbeccf; border-radius: 3px; padding: 0 4px; font-size: 12px; }
.eps { display: grid; gap: 12px; margin-top: 14px; }
.ep { border: 1px solid var(--line); border-radius: 10px; }
.ep.off { background: #fafbfc; }
.ep.off .ep-top { opacity: .6; }
.ep-top { display: grid; grid-template-columns: 22px auto 1fr auto; column-gap: 14px; align-items: start; padding: 14px 18px; }
.ep-top input[type=checkbox] { margin: 5px 0 0; width: 16px; height: 16px; accent-color: var(--blue); }
.ep-path { font-family: ui-monospace, Menlo, monospace; font-size: 15px; line-height: 26px; word-break: break-all; }
.ep-sum { font-size: 14px; color: var(--muted); margin-top: 3px; }
.ep-params { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.ep-params .pill.req { border-color: #f0c2bd; }
.ep-params .pill.req::after { content: "*"; color: #e0503f; margin-left: 2px; }
.ep-tog { font-size: 13px; color: var(--blue); display: inline-flex; align-items: center; gap: 4px; margin-top: 4px; }
.ep-tog svg { transition: transform .15s; }
.ep.open .ep-tog svg { transform: rotate(180deg); }
.ep-detail { border-top: 1px dashed var(--line); padding: 12px 18px 16px 90px; display: none; }
.ep.open .ep-detail { display: block; }
.ep-detail h5 { font-size: 13px; color: var(--ink-2); margin: 10px 0 6px; }
.ep-detail h5:first-child { margin-top: 0; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th, .tbl td { text-align: left; padding: 7px 10px; border-top: 1px solid #eef0f4; vertical-align: top; }
.tbl th { color: var(--muted); font-weight: 500; background: #fafbfc; border-top: 0; }
.tbl code { font-size: 12.5px; }
.tbl td .inp, .tbl td .sel select { height: 32px; font-size: 13px; }
.tbl.tools td { vertical-align: middle; }
.tbl.tools td:first-child { width: 36px; }
.src-tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 18px 0 16px; }
.src-tabs button { height: 38px; padding: 0 16px; font-size: 14px; color: var(--ink-2); border-bottom: 2px solid transparent; margin-bottom: -1px; display: inline-flex; align-items: center; gap: 6px; }
.src-tabs button.on { color: var(--blue); border-bottom-color: var(--blue); font-weight: 600; }
.drop { border: 1.5px dashed #c7cedb; border-radius: 12px; background: #fafbfd; padding: 42px 20px; text-align: center; cursor: pointer; transition: border-color .15s, background .15s; }
.drop:hover, .drop.over { border-color: var(--blue); background: #f5f8ff; }
.drop .dic { width: 52px; height: 52px; border-radius: 14px; background: var(--blue-soft); color: var(--blue); display: grid; place-items: center; margin: 0 auto 12px; }
.drop b { font-size: 15px; font-weight: 500; }
.drop p { font-size: 13px; color: var(--muted); margin-top: 6px; }
.file-card { display: flex; align-items: center; gap: 12px; border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; margin-top: 14px; }
.file-card .fic { width: 38px; height: 38px; border-radius: 8px; background: #eef2f8; color: #4b5566; display: grid; place-items: center; }
.file-card b { font-weight: 500; }
.file-card small { display: block; color: var(--muted); font-size: 12.5px; }
.samples { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 16px; font-size: 13px; color: var(--muted); }
.samples button { height: 28px; padding: 0 12px; border-radius: 14px; border: 1px solid var(--line-2); font-size: 12.5px; color: var(--ink-2); background: #fff; }
.samples button:hover { border-color: var(--blue-line); color: var(--blue); }
.editor { position: relative; }
.editor .tx.code { min-height: 340px; padding-left: 14px; white-space: pre; overflow: auto; tab-size: 2; }
.editor .fmt { position: absolute; right: 10px; top: 8px; display: flex; gap: 6px; }
.errbox { margin-top: 12px; border: 1px solid #f3c3bd; background: #fff5f4; border-radius: 8px; padding: 10px 14px; font-size: 13px; color: #b0342a; display: flex; gap: 8px; align-items: flex-start; }
.errbox code { background: #fde3df; padding: 0 4px; border-radius: 3px; }
.support { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 20px; }
.support div { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; font-size: 13px; color: var(--muted); line-height: 1.65; }
.support b { display: flex; align-items: center; gap: 6px; color: var(--ink); font-weight: 500; font-size: 14px; margin-bottom: 4px; }
.cgrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0 28px; }
.cgrid .full { grid-column: 1 / -1; }
.colors { display: flex; gap: 8px; }
.colors button { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; color: #fff; }
.colors button.on { box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--blue); }
.auth-sub { margin-top: 14px; padding: 16px 18px; border-radius: 10px; background: var(--field); }
.auth-sub .cgrid { gap: 0 18px; }
.lockline { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: #1c8a52; margin-top: 12px; }
.hrow { display: grid; grid-template-columns: 1fr 1.4fr 28px; gap: 8px; align-items: center; margin-bottom: 8px; }
pre.json { margin: 0; max-height: 380px; overflow: auto; background: #0f1c32; color: #d6e2f5; border-radius: 8px; padding: 12px 14px; font: 12px/1.65 ui-monospace, Menlo, Consolas, monospace; white-space: pre; }
details.more-def { margin-top: 14px; }
details.more-def summary { cursor: pointer; font-size: 13.5px; color: var(--blue); list-style: none; display: inline-flex; align-items: center; gap: 4px; }
details.more-def summary::-webkit-details-marker { display: none; }
details.more-def[open] summary { margin-bottom: 10px; }

/* ---------- 工作流工具：画布 ---------- */
.wf { height: 100%; display: grid; grid-template-columns: 1fr var(--panel); }
.wf.nopanel { grid-template-columns: 1fr 0; }
.canvas { position: relative; overflow: hidden; background-color: #f2f4f7; background-image: radial-gradient(#cfd4dd 1px, transparent 1.2px); background-size: 18px 18px; cursor: grab; touch-action: none; }
.canvas.panning { cursor: grabbing; }
.world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.world svg.edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
.edges path.e { fill: none; stroke: #b3bac6; stroke-width: 1.6; }
.edges path.hit { fill: none; stroke: transparent; stroke-width: 14; pointer-events: stroke; cursor: pointer; }
.edges g:hover path.e { stroke: #7f8da3; }
.edges g.on path.e { stroke: var(--blue); stroke-width: 2; }
.edges g.run path.e { stroke: #19a974; stroke-width: 2; stroke-dasharray: 6 4; animation: flow .6s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -10; } }
.edges path.tmp { fill: none; stroke: var(--blue); stroke-width: 1.6; stroke-dasharray: 5 4; }
.edge-x { position: absolute; width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 1px solid var(--line-2); color: #d23b3b; display: grid; place-items: center; transform: translate(-50%, -50%); box-shadow: 0 2px 6px rgba(0,0,0,.1); z-index: 3; }
.node { position: absolute; width: 250px; background: #fff; border: 1.5px solid #e3e6ec; border-radius: 12px; box-shadow: 0 2px 6px rgba(20, 30, 50, .05); cursor: default; user-select: none; }
.node:hover { border-color: #cfd5df; }
.node.on { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(47, 91, 234, .12); }
.node.st-running { border-color: #f0a020; }
.node.st-ok { border-color: #19a974; }
.node.st-fail { border-color: #d23b3b; }
.node.st-skip { opacity: .55; }
.nh { display: flex; align-items: center; gap: 9px; padding: 12px 12px 8px 14px; cursor: move; }
.nic { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; color: #fff; flex: none; }
.nh b { font-size: 15px; font-weight: 600; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nh .nmore { width: 22px; height: 22px; border-radius: 5px; display: grid; place-items: center; color: var(--muted); }
.nh .nmore:hover { background: var(--bg); }
.nst { font-size: 11.5px; font-style: normal; display: inline-flex; align-items: center; gap: 4px; }
.nst.running { color: #b87400; }
.nst.ok { color: #0f8a55; }
.nst.fail { color: #c0392b; }
.nb { padding: 0 12px 12px; }
.nsum { background: #f7f8fa; border: 1px solid #eef0f4; border-radius: 8px; padding: 7px 9px; font-size: 12.5px; color: var(--ink-2); display: grid; gap: 4px; }
.nsum .ln { display: flex; align-items: center; gap: 6px; min-width: 0; }
.nsum .ln > span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.nsum i.tg { font-style: normal; font-size: 10.5px; line-height: 16px; padding: 0 5px; border-radius: 3px; color: #fff; flex: none; }
.nsum small { color: var(--muted); font-size: 11.5px; }

.varpanel { position: absolute; left: 16px; top: 66px; width: 340px; background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 12px 32px rgba(20, 30, 50, .14); padding: 12px 14px; z-index: 30; max-height: calc(100% - 90px); overflow: auto; }

.nmenu { position: absolute; z-index: 35; width: 150px; }
.nmenu.menu { top: auto; right: auto; }

/* ---------- 右侧节点配置 ---------- */
.panel { border-left: 1px solid var(--line); background: #fff; overflow: auto; position: relative; min-width: 0; }
.ph { display: flex; align-items: center; gap: 10px; padding: 18px 20px 10px; position: sticky; top: 0; background: #fff; z-index: 2; }
.ph .nic { width: 32px; height: 32px; border-radius: 8px; }
.ph h3 { flex: 1; font-size: 18px; font-weight: 600; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pb { padding: 0 20px 40px; }
.grp { border-bottom: 1px solid var(--line); padding-bottom: 8px; margin-bottom: 16px; }
.grp > .gh { display: flex; align-items: center; gap: 6px; height: 36px; font-size: 15px; color: var(--ink-2); width: 100%; }
.grp > .gh svg { transition: transform .15s; }
.grp.fold > .gh svg { transform: rotate(-90deg); }
.grp.fold > .gb { display: none; }
.grp > .gb { padding: 6px 0 4px 24px; }
.sec { margin-bottom: 18px; }
.sec > .sh { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.sec > .sh b { font-size: 15px; font-weight: 600; }
.sec > .sh small { font-size: 12.5px; color: var(--muted); }
.sec > .sh .sp { flex: 1; }
.vrow { display: grid; grid-template-columns: 1.1fr .9fr 30px 28px; gap: 6px; align-items: center; margin-bottom: 6px; }
.vrow.out { grid-template-columns: 1fr 1.3fr 28px; }
.vrow.cond { grid-template-columns: 1.2fr 92px 1fr 28px; }
.vrow .req { width: 30px; height: 30px; border-radius: 6px; display: grid; place-items: center; font-size: 13px; color: var(--muted-2); border: 1px solid var(--line-2); }
.vrow .req.on { color: #e0503f; border-color: #f0c2bd; background: #fff5f4; }
.vdesc { grid-column: 1 / -1; margin: -2px 0 8px; }
.outs { display: grid; gap: 6px; }
.outs div { display: flex; align-items: center; gap: 8px; font-size: 13px; background: var(--field); border-radius: 6px; padding: 6px 10px; }
.outs code { font-size: 12.5px; }
.outs small { color: var(--muted); margin-left: auto; }
.refbox { position: relative; }
.vpop { position: absolute; left: 0; right: 0; top: 100%; margin-top: 4px; background: #fff; border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 28px rgba(20, 30, 50, .14); padding: 6px; z-index: 20; max-height: 240px; overflow: auto; }
.vpop .vh { font-size: 12px; color: var(--muted); padding: 4px 8px; }
.vpop button { display: flex; width: 100%; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; font-size: 13px; text-align: left; }
.vpop button:hover, .vpop button.on { background: var(--blue-soft); }
.vpop button code { font-size: 12px; }
.vpop button small { margin-left: auto; color: var(--muted); font-size: 11.5px; }
.tcards { display: grid; gap: 8px; }
.tcard { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: #fafbfc; }
.tcard b { font-size: 13.5px; font-weight: 500; }
.tcard small { display: block; font-size: 12px; color: var(--muted); }
.tcard .grow { min-width: 0; }
.iface { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; }
.iface h4 { font-size: 14px; display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
.iface p { font-size: 13px; color: var(--muted); line-height: 1.7; }
.iface .tbl { margin-top: 6px; }
.ptip { background: #f4f7ff; border: 1px solid #dfe6fb; border-radius: 10px; padding: 12px 14px; font-size: 13px; color: #3b4a73; line-height: 1.7; margin-bottom: 14px; }
.float-bot { position: absolute; right: calc(var(--panel) + 18px); bottom: 90px; width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; color: #fff; background: radial-gradient(circle at 35% 30%, #8fb0ff, #3a5ee8 70%); box-shadow: 0 6px 20px rgba(60, 90, 230, .35), 0 0 0 6px rgba(140, 170, 255, .18); z-index: 6; }
.wf.nopanel .float-bot { right: 18px; }

/* ---------- 试运行抽屉 ---------- */
.run { position: absolute; right: 0; top: 0; bottom: 0; width: 460px; background: #fff; border-left: 1px solid var(--line); box-shadow: -12px 0 30px rgba(20, 30, 50, .08); z-index: 25; display: flex; flex-direction: column; }
.run header { display: flex; align-items: center; gap: 10px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.run header h3 { flex: 1; font-size: 16px; }
.run .rb { flex: 1; overflow: auto; padding: 16px 20px; }
.run .rtabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 0 0 14px; }
.run .rtabs button { height: 34px; padding: 0 12px; font-size: 13.5px; color: var(--ink-2); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.run .rtabs button.on { color: var(--blue); border-bottom-color: var(--blue); font-weight: 600; }
.trace { display: grid; gap: 8px; }
.trace details { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; font-size: 13px; }
.trace summary { display: flex; align-items: center; gap: 8px; cursor: pointer; list-style: none; }
.trace summary::-webkit-details-marker { display: none; }
.trace summary .nic { width: 22px; height: 22px; border-radius: 6px; }
.trace summary b { flex: 1; font-weight: 500; }
.trace summary small { color: var(--muted); }
.trace pre { margin: 8px 0 0; background: #f7f8fa; border-radius: 6px; padding: 8px 10px; font: 11.5px/1.6 ui-monospace, Menlo, monospace; white-space: pre-wrap; word-break: break-all; max-height: 220px; overflow: auto; }
.run-sum { display: flex; gap: 14px; font-size: 13px; color: var(--muted); margin-bottom: 12px; }
.run-sum b { color: var(--ink); font-weight: 600; }

/* ---------- 弹窗 ---------- */
.mask { position: fixed; inset: 0; background: rgba(20, 26, 38, .38); display: grid; place-items: center; z-index: 50; }
.dlg { width: min(640px, calc(100% - 32px)); max-height: calc(100vh - 80px); display: flex; flex-direction: column; background: #fff; border-radius: 12px; box-shadow: 0 20px 50px rgba(0, 0, 0, .18); }
.dlg.wide { width: min(760px, calc(100% - 32px)); }
.dlg header { display: flex; align-items: center; padding: 18px 22px 12px; }
.dlg header h3 { flex: 1; font-size: 16px; }
.dlg .dbody { overflow: auto; padding: 4px 22px 8px; flex: 1; }
.dlg footer { display: flex; align-items: center; gap: 10px; padding: 14px 22px 18px; border-top: 1px solid var(--line); margin-top: 8px; }
.dlg footer .note { flex: 1; font-size: 12.5px; color: var(--muted); }
.checklist { display: grid; gap: 6px; font-size: 13px; background: var(--field); border-radius: 8px; padding: 10px 14px; margin-bottom: 14px; }
.checklist li { display: flex; gap: 8px; align-items: center; }
.checklist li.bad { color: #c2410c; }
.checklist li.good { color: #1c8a52; }
.pick { display: flex; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px; cursor: pointer; align-items: flex-start; }
.pick:hover { border-color: #cfd5df; }
.pick.on { border-color: var(--blue-line); background: #f7f9ff; }
.pick input { margin-top: 4px; accent-color: var(--blue); }
.pick b { font-weight: 500; font-size: 14px; }
.pick p { font-size: 12.5px; color: var(--muted); margin-top: 2px; line-height: 1.55; }
.pick small { font-size: 11.5px; color: var(--muted); margin-left: 6px; font-weight: 400; }
.kitgrp { font-size: 12.5px; color: var(--muted); margin: 12px 0 6px; display: flex; align-items: center; gap: 6px; }
.dsearch { display: flex; align-items: center; gap: 8px; height: 38px; border: 1px solid var(--line-2); border-radius: 8px; padding: 0 12px; color: var(--muted); margin-bottom: 10px; }
.dsearch input { flex: 1; border: 0; outline: none; font-size: 14px; color: var(--ink); }
.toast { position: fixed; left: 50%; top: 76px; transform: translateX(-50%); background: #1f2329; color: #fff; padding: 9px 18px; border-radius: 8px; font-size: 13.5px; z-index: 80; box-shadow: 0 8px 24px rgba(0, 0, 0, .18); max-width: 80vw; }

@media (max-width: 1200px) { :root { --panel: 360px; } .cgrid { grid-template-columns: 1fr; } .support { grid-template-columns: 1fr; } }

<body>
<!--
  新建工具（独立页面）
  1. 从「科学工具箱.html」点「新建工具」进入；#workflow 直接打开工作流工具。
  2. 自定义工具：上传符合 OpenAPI 规范（3.0 / 3.1，兼容 Swagger 2.0）的 JSON 或 YAML → 预览解析出的端点 → 配置分类、服务地址、鉴权与工具列表。
     创建后平台把它封装成一个 MCP 服务（工具箱），每个选中的端点就是其中一个工具。
  3. 工作流工具：在画布上把固定流程编排好（类似 n8n），开始节点的输入变量 = 工具入参，结束节点的输出 = 返回值；发布后作为一个工具供 AI 调用，也可通过 HTTP 接口调用。
  4. 创建 / 发布后带 #created=<JSON> 回到科学工具箱，新条目出现在列表最前面。
  5. 视觉参考用户提供的截图：创建自定义工具（上传 Schema / 预览 / 配置）、工作流编辑器（添加节点、智能体节点配置）。
-->
<header class="top">
  <div class="top-l" id="top-l"></div>
  <div class="seg" role="tablist" aria-label="工具类型">
    <button type="button" data-mode="custom" class="on">自定义工具</button>
    <button type="button" data-mode="flow">工作流工具</button>
  </div>
  <div class="top-r" id="top-r"></div>
  <div class="menu" id="hist-menu" style="right:230px;width:280px" hidden></div>
  <div class="menu" id="more-menu" style="right:170px" hidden>
    <button type="button" data-more="sample"><span data-icon="spark" data-size="16"></span>用示例填充（分子性质批量计算）</button>
    <button type="button" data-more="export"><span data-icon="download" data-size="16"></span>导出工作流 JSON</button>
    <button type="button" data-more="import"><span data-icon="upload" data-size="16"></span>导入工作流 JSON</button>
    <button type="button" data-more="layout"><span data-icon="layout" data-size="16"></span>整理布局</button>
    <button type="button" data-more="reset" class="danger"><span data-icon="trash" data-size="16"></span>清空画布</button>
  </div>
  <div class="menu" id="pub-menu" style="right:20px;width:220px" hidden>
    <button type="button" data-pub="draft"><span data-icon="save" data-size="16"></span><span>保存草稿<small>不发布，下次从草稿继续</small></span></button>
    <button type="button" data-pub="check"><span data-icon="shield" data-size="16"></span><span>发布前检查<small>检查节点连线与配置</small></span></button>
  </div>
</header>

<main class="main">
  <section class="cs" id="custom" aria-label="自定义工具"></section>
  <section class="wf" id="flow" aria-label="工作流工具" hidden>
    <div class="canvas" id="canvas">
      <div class="world" id="world"><svg class="edges" id="edges" width="1" height="1"></svg><div id="nodes"></div></div>
      <div class="cv-tools">
        <button type="button" class="cv-add" id="add-btn"><span class="pl" data-icon="plus" data-size="14"></span>添加节点</button>
        <span class="vsep"></span>
        <button type="button" id="layout-btn" title="整理布局"><span data-icon="layout" data-size="20"></span></button>
        <button type="button" id="var-btn" title="变量"><span class="mono" style="font-size:15px">{x}</span></button>
      </div>
      <div class="addmenu" id="addmenu" hidden></div>
      <div class="varpanel" id="varpanel" hidden></div>
      <div class="cv-zoom">
        <button type="button" data-zoom="-1" title="缩小"><span data-icon="zoomout" data-size="20"></span></button>
        <span id="zoom-v">100%</span>
        <button type="button" data-zoom="1" title="放大"><span data-icon="zoomin" data-size="20"></span></button>
        <button type="button" data-zoom="fit" title="适应画布"><span data-icon="fit" data-size="20"></span></button>
      </div>
      <div class="cv-tip">拖动节点右侧圆点连线 · 点连线可删除 · 拖动空白处平移 · Ctrl + 滚轮缩放</div>
      <div class="menu nmenu" id="nmenu" hidden></div>
    </div>
    <aside class="panel" id="panel"></aside>
    <button class="float-bot" type="button" id="bot" title="编排助手：描述流程，自动生成节点"><span data-icon="bot" data-size="24"></span></button>
    <section class="run" id="run" hidden></section>
  </section>
</main>
<div class="mask" id="mask" hidden></div>
<div class="toast" id="toast" hidden role="status"></div>
<input type="file" id="file-in" accept=".json,.yaml,.yml" hidden />
<input type="file" id="wf-in" accept=".json" hidden />

function icon(name, size, sw) {
  const s = size || 18
  return `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw || 1.7}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name] || ICONS.spark}</svg>`
}
function paintIcons(root) {
  root.querySelectorAll("[data-icon]").forEach((el) => { el.innerHTML = icon(el.dataset.icon, +el.dataset.size || 18); el.style.display = el.style.display || "inline-grid" })
}
function esc(v) { return String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])) }
let toastTimer = 0
function toast(text) {
  const t = document.getElementById("toast")
  t.textContent = text
  t.hidden = false
  clearTimeout(toastTimer)
  toastTimer = setTimeout(() => { t.hidden = true }, 2600)
}
const $ = (sel, root) => (root || document).querySelector(sel)

function slug(s, fallback) {
  const t = String(s || "").trim().toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "")

}

function jsonType(t) { return /^array/.test(t) ? "array" : ["string", "number", "integer", "boolean"].includes(t) ? t : "object" }
function mcpDefs() {
  const c = C.cfg
  return { server: c.id, transport: "streamable-http", tools: C.api.eps.filter((e) => e.include).map((ep) => {
    const props = {}, req = []
    ep.params.forEach((p) => { props[p.name] = Object.assign({ type: jsonType(p.type) }, p.desc ? { description: p.desc } : {}, p.enum ? { enum: p.enum } : {}); if (p.req) req.push(p.name) })
    return { name: `${c.id}.${ep.toolName}`, description: ep.toolDesc || ep.summary || "", inputSchema: { type: "object", properties: props, required: req }, annotations: { readOnlyHint: !ep.write, destructiveHint: ep.method === "delete", requiresConfirmation: ep.confirm } }
  }) }
}

function openTest(i) {
  const ep = C.api.eps[i], c = C.cfg
  const mask = $("#mask")
  mask.innerHTML = `<div class="dlg wide" role="dialog" aria-modal="true"><header><h3><span class="m ${ep.method}" style="min-width:0;height:22px;font-size:11.5px;margin-right:8px">${ep.method.toUpperCase()}</span><code style="font-size:14px">${esc(ep.path)}</code></h3><button class="icon-btn" type="button" data-close>${icon("close", 18)}</button></header>
    <div class="dbody">
      <p class="hint" style="margin-bottom:12px">用测试参数调用接口，确认服务地址和鉴权可用。工具名 <code>${esc(c.id)}.${esc(ep.toolName)}</code></p>
      ${ep.params.length ? ep.params.map((p) => `<label class="fl" style="margin-bottom:12px"><span><code>${esc(p.name)}</code>${p.req ? "<em>*</em>" : ""}<small>${esc(p.in)} · ${esc(p.type)}${p.desc ? " · " + esc(p.desc) : ""}</small></span>${p.enum ? sel(`<select data-tp="${esc(p.name)}">${p.enum.map((v) => `<option>${esc(v)}</option>`).join("")}</select>`) : `<input class="inp mono" data-tp="${esc(p.name)}" value="${esc(p.def !== undefined ? p.def : example({ type: jsonType(p.type) === "array" ? "string" : jsonType(p.type) }, p.name))}" />`}</label>`).join("") : `<p class="hint">该端点没有参数。</p>`}
      <div id="test-out"></div>
    </div>
    <footer><span class="note">${c.auth.type === "none" ? "无鉴权" : "鉴权由网关注入，请求预览中已打码"}</span><button class="btn ghost" type="button" data-close>关闭</button><button class="btn" type="button" id="test-send">${icon("send", 15)}发送请求</button></footer></div>`
  mask.hidden = false
  $("#test-send").addEventListener("click", () => {
    const vals = {}
    $$("[data-tp]", mask).forEach((el) => { vals[el.dataset.tp] = el.value })
    const miss = ep.params.filter((p) => p.req && !String(vals[p.name] || "").trim())
    if (miss.length) { toast("请填写必填参数：" + miss.map((p) => p.name).join("、")); return }
    const base = (c.server || "").replace(/\/$/, "")
    if (!base) { toast("请先填写服务地址"); return }
    let path = ep.path
    const q = [], body = {}, headers = c.headers.filter((h) => h.k).map((h) => `${h.k}: ${h.v}`)
    ep.params.forEach((p) => {
      const v = vals[p.name]
      if (p.in === "path") path = path.replace(`{${p.name}}`, encodeURIComponent(v))
      else if (p.in === "query" && v !== "") q.push(`${p.name}=${encodeURIComponent(v)}`)
      else if (p.in === "header" && v !== "") headers.push(`${p.name}: ${v}`)
      else if (p.in === "body" && v !== "") body[p.name] = /^(number|integer)$/.test(p.type) ? Number(v) : v
    })
    if (c.auth.type === "apikey") { if (c.auth.in === "query") q.push(`${c.auth.name}=••••••`); else headers.push(`${c.auth.name}: ••••••（网关注入）`) }
    if (c.auth.type === "bearer" || c.auth.type === "oauth2") headers.push("Authorization: Bearer ••••••（网关注入）")
    const req = `${ep.method.toUpperCase()} ${base}${path}${q.length ? "?" + q.join("&") : ""}\n${headers.join("\n")}${Object.keys(body).length ? "\n\n" + JSON.stringify(body, null, 2) : ""}`
    const out = $("#test-out")
    out.innerHTML = `<p class="hint" style="margin:6px 0">请求中…</p>`
    setTimeout(() => {
      const res = mockResponse(ep)
      const ms = 120 + Math.round(Math.random() * 300)
      out.innerHTML = `<h5 style="font-size:13px;margin:12px 0 6px">请求</h5><pre class="json">${esc(req)}</pre>
        <h5 style="font-size:13px;margin:12px 0 6px;display:flex;gap:8px;align-items:center">响应 <span class="badge ok">${esc(ep.resp.code)} OK</span><span class="hint">${ms} ms · 原型中为模拟返回</span></h5><pre class="json">${esc(typeof res === "string" ? res || "（空响应）" : JSON.stringify(res, null, 2))}</pre>`
      ep.tested = true
    }, 500)
  })
}

/* ---------- 创建 ---------- */
function validateCustom() {
  const c = C.cfg
  const inc = C.api.eps.filter((e) => e.include)
  if (!c.name.trim()) return "请填写工具箱名称"
  if (!/^[a-z][a-z0-9_]{1,39}$/.test(c.id)) return "标识只能用小写字母、数字和下划线，且以字母开头"
  if (!c.scenes.length) return "请至少选择一个应用场景"
  if (!/^https?:\/\/\S+/.test(c.server)) return "请填写以 http(s):// 开头的服务地址"
  if (c.auth.type !== "none" && !c.auth.key) return "请从密钥库选择鉴权凭据"
  if (c.auth.type === "oauth2" && (!c.auth.tokenUrl || !c.auth.clientId)) return "请填写 OAuth 2.0 的 Token URL 和 Client ID"
  if (!inc.length) return "请至少导入一个端点"
  const names = {}
  for (const ep of inc) {
    if (!/^[a-zA-Z][a-zA-Z0-9_]{0,63}$/.test(ep.toolName)) return `工具名「${ep.toolName}」不合法：只能用字母、数字和下划线`
    if (names[ep.toolName]) return `工具名「${ep.toolName}」重复`
    names[ep.toolName] = 1
  }
  return ""
}
function createCustom() {
  const err = validateCustom()
  if (err) { toast(err); return }
  const c = C.cfg
  const payload = {
    kind: "toolkit", id: "new-" + Date.now(), name: c.name.trim(), server: c.id, field: c.field, dirs: c.field === "通用" ? [] : c.dirs,
    scenes: c.scenes, license: c.lic, desc: c.desc.trim() || C.api.desc, color: COLORS[c.color][0], source: "OpenAPI",
    baseUrl: c.server, auth: { none: "无鉴权", apikey: "API Key", bearer: "Bearer Token", oauth2: "OAuth 2.0" }[c.auth.type],
    tools: C.api.eps.filter((e) => e.include).map((ep) => ({ key: ep.toolName, name: ep.summary || ep.toolName, desc: ep.toolDesc || ep.summary || "", out: ep.resp.desc || "JSON 响应", method: ep.method.toUpperCase(), path: ep.path, confirm: ep.confirm }))
  }
  toast(`已创建「${payload.name}」，包含 ${payload.tools.length} 个工具，正在返回科学工具箱…`)
  setTimeout(() => { location.href = "科学工具箱.html#created=" + encodeURIComponent(JSON.stringify(payload)) }, 700)
}

/* ---------- 事件 ---------- */
function setPath(obj, path, v) { const ks = path.split("."); const last = ks.pop(); ks.reduce((o, k) => o[k], obj)[last] = v }
function bindCustom() {
  const root = $("#custom")
  root.addEventListener("click", (e) => {
    const t = e.target.closest("button, [data-sample], #drop")
    if (!t) return
    if (t.id === "drop") { $("#file-in").click(); return }
    if (t.dataset.tab) { C.tab = t.dataset.tab; renderCustom(); return }
    if (t.dataset.sample) {
      const s = SAMPLES[t.dataset.sample]
      loadSchema(s.text, s.file, s.hint)
      if (C.tab === "url") C.tab = "upload"
      renderCustom(); toast(`已载入示例：${C.api.title}`); return
    }
    if (t.dataset.go) { C.step = +t.dataset.go; renderCustom(); return }
    if (t.dataset.open !== undefined) { const ep = C.api.eps[+t.dataset.open]; ep.open = !ep.open; renderCustom(); return }
    if (t.dataset.test !== undefined) { openTest(+t.dataset.test); return }
    if (t.dataset.color !== undefined) { C.cfg.color = +t.dataset.color; renderCustom(); return }
    if (t.dataset.hdel !== undefined) { C.cfg.headers.splice(+t.dataset.hdel, 1); renderCustom(); return }
    const act = t.dataset.act
    if (!act) return

    if (act === "next") {
      if (C.step === 1 && !C.api) { toast("请先上传或粘贴 OpenAPI 文档"); return }

      C.step++; renderCustom(); root.scrollTop = 0
    }
    if (act === "create") createCustom()
    if (act === "clear") { C.text = ""; C.file = null; C.api = null; C.cfg = null; C.err = null; renderCustom() }
    if (act === "to-paste") { C.tab = "paste"; renderCustom() }
    if (act === "parse") { loadSchema($("#schema-text").value, C.file ? C.file.name : "粘贴内容"); renderCustom(); if (C.api) toast(`解析成功：${C.api.eps.length} 个端点`) }

      try { const v = JSON.parse($("#schema-text").value); C.text = JSON.stringify(v, null, 2); renderCustom() } catch (er) { toast("当前内容不是合法 JSON，YAML 无需格式化") }

        C.busy = false
        const s = /quake|seis|event|fdsn/i.test(u) ? SAMPLES.quake : SAMPLES.mat

      }, 700)
    }
    if (act === "all") { C.api.eps.forEach((x) => { x.include = true }); renderCustom() }
    if (act === "onlyget") { C.api.eps.forEach((x) => { x.include = x.method === "get" }); renderCustom() }

  })
  root.addEventListener("change", (e) => {
    const t = e.target
    if (t.dataset.inc !== undefined) { C.api.eps[+t.dataset.inc].include = t.checked; renderCustom(); return }
    if (t.name === "c-field") { C.cfg.field = t.value; C.cfg.dirs = []; renderCustom(); return }
    if (t.name === "c-lic") { C.cfg.lic = t.value; renderCustom(); return }
    if (t.name === "c-auth") { C.cfg.auth.type = t.value; renderCustom(); return }
    if (t.dataset.dir) { const d = C.cfg.dirs; t.checked ? d.push(t.dataset.dir) : d.splice(d.indexOf(t.dataset.dir), 1); t.closest(".ck").classList.toggle("on", t.checked); return }
    if (t.dataset.scene) { const d = C.cfg.scenes; t.checked ? d.push(t.dataset.scene) : d.splice(d.indexOf(t.dataset.scene), 1); t.closest(".ck").classList.toggle("on", t.checked); return }
    if (t.dataset.epF === "confirm") { C.api.eps[+t.dataset.i].confirm = t.checked; return }
    if (t.dataset.c === "serverMode") { C.cfg.serverMode = t.value; if (t.value !== "custom") C.cfg.server = C.api.servers[+t.value]; else C.cfg.server = ""; renderCustom(); return }
    if (t.dataset.c === "auth.key" && t.value === "__new") {
      const name = `${C.cfg.name} 密钥`
      if (!VAULT.includes(name)) VAULT.push(name)
      C.cfg.auth.key = name; renderCustom(); toast(`已在密钥库新建「${name}」，密钥值请在密钥库中填写`); return
    }
    if (t.dataset.c) { setPath(C.cfg, t.dataset.c, t.dataset.c === "timeout" || t.dataset.c === "retry" ? +t.value : t.value); if (t.tagName === "SELECT") renderCustom() }
  })
  root.addEventListener("input", (e) => {
    const t = e.target
    if (t.id === "schema-text") { C.text = t.value; return }
    if (t.id === "schema-url") { C.url = t.value; return }
    if (t.dataset.c && t.tagName !== "SELECT") { setPath(C.cfg, t.dataset.c, t.value); return }
    if (t.dataset.epF && t.dataset.epF !== "confirm") { C.api.eps[+t.dataset.i][t.dataset.epF] = t.value.trim(); return }
    if (t.dataset.h !== undefined) { C.cfg.headers[+t.dataset.h][t.dataset.hk] = t.value }
  })
  root.addEventListener("focusout", (e) => {
    // 工具名 / 标识改完后刷新 MCP 定义预览
    if (C.step === 3 && (e.target.dataset.epF === "toolName" || e.target.dataset.c === "id")) { const d = $(".more-def pre", root); if (d) d.textContent = JSON.stringify(mcpDefs(), null, 2) }
  })
  root.addEventListener("dragover", (e) => { const d = e.target.closest && e.target.closest("#drop"); if (d) { e.preventDefault(); d.classList.add("over") } })
  root.addEventListener("dragleave", (e) => { const d = e.target.closest && e.target.closest("#drop"); if (d) d.classList.remove("over") })
  root.addEventListener("drop", (e) => {
    const d = e.target.closest && e.target.closest("#drop")
    if (!d) return
    e.preventDefault(); d.classList.remove("over")

}
function readSchemaFile(f) {

/* ---------- 图关系 ---------- */
function upstream(id) {
  const seen = new Set(), order = []
  const visit = (x) => { F.edges.filter((e) => e.to === x).forEach((e) => { if (!seen.has(e.from)) { seen.add(e.from); visit(e.from); order.push(e.from) } }) }
  visit(id)
  return order.map(nodeById).filter(Boolean)
}
function reaches(a, b) { // a 能否沿连线到达 b
  const seen = new Set([a]), q = [a]
  while (q.length) { const x = q.shift(); if (x === b) return true; F.edges.filter((e) => e.from === x).forEach((e) => { if (!seen.has(e.to)) { seen.add(e.to); q.push(e.to) } }) }
  return false
}

}

function portPos(id, port) {
  const el = $(`.node[data-id="${id}"]`), n = nodeById(id)
  if (!el || !n) return null
  const p = port === "in" ? $(".port.in", el) : $(`.port.out[data-port="${port}"]`, el)
  if (!p) return null
  return { x: n.x + el.clientLeft + p.offsetLeft + p.offsetWidth / 2, y: n.y + el.clientTop + p.offsetTop + p.offsetHeight / 2 }
}
function curve(a, b) { const dx = Math.max(50, Math.abs(b.x - a.x) / 2); return `M${a.x},${a.y} C${a.x + dx},${a.y} ${b.x - dx},${b.y} ${b.x},${b.y}` }
const SVG_OFF = 4000
function renderEdges() {
  const svg = $("#edges")
  const active = F.run ? F.run.edges : {}
  let html = `<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#b3bac6"/></marker><marker id="arr-on" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#2f5bea"/></marker></defs><g>`
  let mid = null

    if (on) mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }
    html += `<g data-edge="${e.id}" class="${on ? "on" : ""}${active[e.id] ? " run" : ""}"><path class="e" d="${d}" marker-end="url(#${on ? "arr-on" : "arr"})"/><path class="hit" d="${d}"/></g>`
  })
  if (drag && drag.kind === "conn" && drag.to) html += `<path class="tmp" d="${curve(drag.a, drag.to)}"/>`
  html += "</g>"
  svg.innerHTML = html
  const old = $("#edge-x"); if (old) old.remove()
  if (mid) {
    const b = document.createElement("button")
    b.id = "edge-x"; b.className = "edge-x"; b.type = "button"; b.title = "删除连线"; b.innerHTML = icon("close", 12, 2.2)
    b.style.left = mid.x + "px"; b.style.top = mid.y + "px"
    $("#world").appendChild(b)
  }
}

  z = Math.min(2, Math.max(0.3, z))
  const r = $("#canvas").getBoundingClientRect()
  const px = cx === undefined ? r.width / 2 : cx - r.left, py = cy === undefined ? r.height / 2 : cy - r.top
  const wx = (px - F.pan.x) / F.zoom, wy = (py - F.pan.y) / F.zoom
  F.zoom = z
  F.pan.x = px - wx * z; F.pan.y = py - wy * z
  applyView()
}
function fitView() {
  if (!F.nodes.length) return
  const r = $("#canvas").getBoundingClientRect()
  let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity
  F.nodes.forEach((n) => { const el = $(`.node[data-id="${n.id}"]`); const h = el ? el.offsetHeight : 100; x1 = Math.min(x1, n.x); y1 = Math.min(y1, n.y); x2 = Math.max(x2, n.x + 250); y2 = Math.max(y2, n.y + h) })
  const pad = 70, top = 70
  const z = Math.min(1.1, Math.max(0.3, Math.min((r.width - pad * 2) / (x2 - x1), (r.height - top - pad) / (y2 - y1))))
  F.zoom = z
  F.pan.x = (r.width - (x2 - x1) * z) / 2 - x1 * z
  F.pan.y = top + (r.height - top - pad - (y2 - y1) * z) / 2 - y1 * z

}
function autoLayout() {
  const start = F.nodes.find((n) => n.type === "start")
  const level = {}
  if (start) {
    level[start.id] = 0
    let changed = true, guard = 0
    while (changed && guard++ < 200) { changed = false; F.edges.forEach((e) => { if (level[e.from] !== undefined && (level[e.to] === undefined || level[e.to] < level[e.from] + 1)) { level[e.to] = level[e.from] + 1; changed = true } }) }
  }
  let maxL = Math.max(0, ...Object.values(level))
  F.nodes.forEach((n) => { if (level[n.id] === undefined) level[n.id] = ++maxL })
  const cols = {}
  F.nodes.slice().sort((a, b) => a.y - b.y).forEach((n) => { (cols[level[n.id]] = cols[level[n.id]] || []).push(n) })
  Object.keys(cols).forEach((L) => { const arr = cols[L]; arr.forEach((n, i) => { n.x = 80 + L * 310; n.y = 220 + (i - (arr.length - 1) / 2) * 170 }) })

}

/* ---------- 画布交互 ---------- */
let drag = null
function toWorld(ev) { const r = $("#canvas").getBoundingClientRect(); return { x: (ev.clientX - r.left - F.pan.x) / F.zoom, y: (ev.clientY - r.top - F.pan.y) / F.zoom } }
function selectNode(id) { F.sel = id; F.selEdge = null; hideFloats(); renderNodes(); renderPanel() }
function hideFloats() { ["#addmenu", "#varpanel", "#nmenu"].forEach((s) => { $(s).hidden = true }); $("#add-btn").classList.remove("on"); $("#var-btn").classList.remove("on") }
function bindCanvas() {
  const cv = $("#canvas")
  cv.addEventListener("pointerdown", (ev) => {
    if (ev.button !== 0) return
    const t = ev.target
    if (t.closest(".cv-tools, .cv-zoom, .addmenu, .varpanel, .nmenu, .edge-x, .nmore")) return
    const port = t.closest(".port.out")
    if (port) {
      const id = port.closest(".node").dataset.id
      drag = { kind: "conn", from: id, port: port.dataset.port, a: portPos(id, port.dataset.port), to: null }
      ev.preventDefault(); return
    }
    const nodeEl = t.closest(".node")
    if (nodeEl) {
      const n = nodeById(nodeEl.dataset.id)
      drag = { kind: "node", id: n.id, sx: ev.clientX, sy: ev.clientY, ox: n.x, oy: n.y, moved: false }
      if (F.sel !== n.id) selectNode(n.id)
      return
    }
    const eg = t.closest("[data-edge]")
    if (eg) { F.selEdge = eg.dataset.edge; F.sel = null; renderEdges(); renderPanel(); return }
    drag = { kind: "pan", sx: ev.clientX, sy: ev.clientY, ox: F.pan.x, oy: F.pan.y, moved: false }
    cv.classList.add("panning")
  })
  window.addEventListener("pointermove", (ev) => {
    if (!drag) return
    if (drag.kind === "node") {
      const dx = (ev.clientX - drag.sx) / F.zoom, dy = (ev.clientY - drag.sy) / F.zoom
      if (Math.abs(dx) + Math.abs(dy) > 2) drag.moved = true
      const n = nodeById(drag.id); n.x = Math.round(drag.ox + dx); n.y = Math.round(drag.oy + dy)
      const el = $(`.node[data-id="${n.id}"]`); el.style.left = n.x + "px"; el.style.top = n.y + "px"
      renderEdges()
    } else if (drag.kind === "pan") {
      F.pan.x = drag.ox + ev.clientX - drag.sx; F.pan.y = drag.oy + ev.clientY - drag.sy
      if (Math.abs(ev.clientX - drag.sx) + Math.abs(ev.clientY - drag.sy) > 3) drag.moved = true
      applyView()
    } else if (drag.kind === "conn") {
      drag.to = toWorld(ev)
      $$(".port.in.hot").forEach((p) => p.classList.remove("hot"))
      const tgt = document.elementFromPoint(ev.clientX, ev.clientY)
      const ne = tgt && tgt.closest && tgt.closest(".node")
      if (ne && ne.dataset.id !== drag.from) { const p = $(".port.in", ne); if (p) p.classList.add("hot") }
      renderEdges()
    }
  })
  window.addEventListener("pointerup", (ev) => {
    if (!drag) return
    const d = drag; drag = null
    cv.classList.remove("panning")
    if (d.kind === "node" && d.moved) touch()
    if (d.kind === "pan" && !d.moved) { F.sel = null; F.selEdge = null; hideFloats(); renderNodes(); renderPanel() }
    if (d.kind === "conn") {
      $$(".port.in.hot").forEach((p) => p.classList.remove("hot"))
      const tgt = document.elementFromPoint(ev.clientX, ev.clientY)
      const ne = tgt && tgt.closest && tgt.closest(".node")
      if (ne) connect(d.from, d.port, ne.dataset.id)
      renderEdges()
    }
  })
  cv.addEventListener("wheel", (ev) => {
    if (ev.target.closest(".addmenu, .varpanel")) return
    ev.preventDefault()
    if (ev.ctrlKey || ev.metaKey) zoomAt(F.zoom * (ev.deltaY < 0 ? 1.1 : 0.9), ev.clientX, ev.clientY)
    else { F.pan.x -= ev.deltaX; F.pan.y -= ev.deltaY; applyView() }
  }, { passive: false })
  cv.addEventListener("click", (ev) => {
    const t = ev.target
    const x = t.closest("#edge-x")
    if (x) { F.edges = F.edges.filter((e) => e.id !== F.selEdge); F.selEdge = null; renderEdges(); renderPanel(); touch("删除连线"); return }
    const nm = t.closest("[data-nmore]")
    if (nm) { openNodeMenu(nm.dataset.nmore, nm); return }
    const z = t.closest("[data-zoom]")
    if (z) { if (z.dataset.zoom === "fit") fitView(); else zoomAt(F.zoom + (+z.dataset.zoom) * 0.1); return }
    const add = t.closest("[data-add]")
    if (add) { addNode(add.dataset.add); return }
    const menuAct = t.closest("[data-nact]")
    if (menuAct) { nodeAction(menuAct.dataset.nact, menuAct.dataset.id); return }
    const vcopy = t.closest("[data-vcopy]")
    if (vcopy) { copyText("{{" + vcopy.dataset.vcopy + "}}"); return }
  })
  $("#add-btn").addEventListener("click", () => { const m = $("#addmenu"); const show = m.hidden; hideFloats(); if (show) { renderAddMenu(); m.hidden = false; $("#add-btn").classList.add("on") } })
  $("#var-btn").addEventListener("click", () => { const m = $("#varpanel"); const show = m.hidden; hideFloats(); if (show) { renderVarPanel(); m.hidden = false; $("#var-btn").classList.add("on") } })
  $("#layout-btn").addEventListener("click", autoLayout)
  document.addEventListener("keydown", (ev) => {
    if (mode !== "flow" || !$("#mask").hidden) return
    if (ev.target.closest && ev.target.closest("input, textarea, select, [contenteditable]")) return
    if (ev.key === "Escape") { hideFloats(); return }
    if (ev.key !== "Delete" && ev.key !== "Backspace") return
    if (F.selEdge) { F.edges = F.edges.filter((e) => e.id !== F.selEdge); F.selEdge = null; renderEdges(); touch("删除连线"); ev.preventDefault(); return }
    if (F.sel) { nodeAction("del", F.sel); ev.preventDefault() }
  })
}
function copyText(s) {
  const done = () => toast(`已复制 ${s}，可粘贴到节点配置中`)
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(s).then(done, () => toast(s))
  else toast(s)
}
function connect(from, port, to) {
  const a = nodeById(from), b = nodeById(to)
  if (!a || !b || from === to) return
  if (b.type === "start") { toast("开始节点不能作为连线终点"); return }
  if (F.edges.some((e) => e.from === from && e.port === port && e.to === to)) return
  if (reaches(to, from)) { toast("不能形成环路；需要重复执行时请用「批量处理」节点"); return }
  addEdge(from, port, to)
  touch(`连接 ${a.title} → ${b.title}`)
}
function renderAddMenu() {
  const s = F.sel && nodeById(F.sel)
  $("#addmenu").innerHTML = (s && s.type !== "end" ? `<div class="anote">将插入到「${esc(s.title)}」之后${s.type === "if" ? "（IF 分支）" : ""}</div>` : "") +
    ADD_GROUPS.map(([g, list]) => `<div class="ah">${g}</div>` + list.map((t) => `<button type="button" data-add="${t}"><span class="nic" style="background:${NT[t].color}">${icon(NT[t].icon, 15, 1.9)}</span><span><b>${NT[t].name}</b><small>${NT[t].desc}</small></span></button>`).join("")).join("")
}
function addNode(type) {
  const s = F.sel && nodeById(F.sel)
  let x, y
  if (s && s.type !== "end") { x = s.x + 310; y = s.y }
  else { const r = $("#canvas").getBoundingClientRect(); x = Math.round((r.width / 2 - 125 - F.pan.x) / F.zoom); y = Math.round((r.height / 2 - 50 - F.pan.y) / F.zoom) }
  // 避免完全重叠
  while (F.nodes.some((n) => Math.abs(n.x - x) < 40 && Math.abs(n.y - y) < 40)) y += 150
  const n = makeNode(type, x, y)
  F.nodes.push(n)
  if (s && s.type !== "end") {
    const port = s.type === "if" ? "if" : "out"
    const outs = F.edges.filter((e) => e.from === s.id && e.port === port)
    // 插入：原来 s → X 的连线改为 新节点 → X
    if (type !== "if") outs.forEach((e) => { e.from = n.id; e.port = "out" })
    else outs.forEach((e) => { e.from = n.id; e.port = "if" })
    addEdge(s.id, port, n.id)
    // 后续节点整体右移，给新节点腾位置
    const moved = new Set()
    const shift = (id) => F.edges.filter((e) => e.from === id).forEach((e) => { if (!moved.has(e.to)) { moved.add(e.to); const m = nodeById(e.to); if (m.x < n.x + 300) { m.x += 310 } shift(e.to) } })
    shift(n.id)
  }
  hideFloats()
  F.sel = n.id; F.selEdge = null

}
function openNodeMenu(id, btn) {
  const n = nodeById(id), m = $("#nmenu")
  const fixed = n.type === "start" || n.type === "end"
  m.innerHTML = `<button type="button" data-nact="edit" data-id="${id}">${icon("edit", 15)}配置</button>` +
    (fixed ? `<div class="none">${n.type === "start" ? "开始" : "结束"}节点不可复制或删除</div>` : `<button type="button" data-nact="dup" data-id="${id}">${icon("copy", 15)}复制</button><button type="button" data-nact="del" data-id="${id}" class="danger">${icon("trash", 15)}删除</button>`)
  const r = $("#canvas").getBoundingClientRect(), b = btn.getBoundingClientRect()
  m.style.left = (b.right - r.left - 150) + "px"; m.style.top = (b.bottom - r.top + 4) + "px"

function nodeAction(act, id) {
  const n = nodeById(id)
  $("#nmenu").hidden = true

  if (act === "edit") { selectNode(id); return }
  if (n.type === "start" || n.type === "end") { toast(`${n.type === "start" ? "开始" : "结束"}节点不可删除`); return }
  if (act === "dup") {
    const c = makeNode(n.type, n.x + 40, n.y + 160, { title: n.title + " 副本", desc: n.desc, data: clone(n.data) })
    F.nodes.push(c); F.sel = c.id; renderNodes(); renderPanel(); touch(`复制${n.title}`)
  }
  if (act === "del") {
    // 删除后把前后节点接起来（只在前后都唯一时）
    const ins = F.edges.filter((e) => e.to === id), outs = F.edges.filter((e) => e.from === id)
    F.edges = F.edges.filter((e) => e.to !== id && e.from !== id)
    if (ins.length === 1 && outs.length === 1 && n.type !== "if") addEdge(ins[0].from, ins[0].port, outs[0].to)

    renderNodes(); renderPanel(); touch(`删除${n.title}`)
  }
}

function getPath(obj, path) { return path.split(".").reduce((o, k) => (o == null ? o : o[k]), obj) }
const LIST_NEW = { "data.vars": () => ({ name: "", type: "string", req: false, desc: "" }), "data.headers": () => ({ k: "", v: "" }), "data.conds": () => ({ ref: "", op: "eq", val: "" }), "data.inputs": () => ({ name: "", ref: "" }), "data.outputs": (n) => (n.type === "end" ? { name: "", ref: "" } : { name: "", type: "string" }) }
function refreshNode(n) {

  $(".nh b", el).textContent = n.title

  renderEdges()
}
function bindPanel() {
  const p = $("#panel")
  p.addEventListener("click", (ev) => {
    const t = ev.target.closest("button")
    if (!t) return
    const n = F.sel && nodeById(F.sel)
    if (t.dataset.fold) { foldState[t.dataset.fold] = !foldState[t.dataset.fold]; t.parentElement.classList.toggle("fold"); return }
    if (t.dataset.act === "pclose") { F.sel = null; renderNodes(); renderPanel(); return }
    if (t.dataset.vins) { insertRef(t.dataset.vins); return }
    if (!n) return
    if (t.dataset.ladd) { getPath(n, t.dataset.ladd).push(LIST_NEW[t.dataset.ladd](n)); renderPanel(); refreshNode(n); touch(); return }
    if (t.dataset.ldel) { getPath(n, t.dataset.ldel).splice(+t.dataset.i, 1); renderPanel(); refreshNode(n); touch(); return }
    if (t.dataset.req) { const v = n.data.vars[+t.dataset.req]; v.req = !v.req; t.classList.toggle("on", v.req); refreshNode(n); touch(); return }
    if (t.dataset.pick) { openToolPicker(n, t.dataset.pick); return }
    if (t.dataset.act === "padd") {
      const nm = ($("#np-name").value || "").trim()
      if (!/^[A-Za-z_][\w]*$/.test(nm)) { toast("参数名只能用字母、数字和下划线"); return }
      if (n.data.params.some((x) => x.name === nm)) { toast("参数已存在"); return }
      n.data.params.push({ name: nm, desc: "", val: "", custom: true }); renderPanel(); refreshNode(n); touch()
    }
  })
  const onVal = (ev, commit) => {
    const t = ev.target
    if (t.dataset.w) { F[t.dataset.w] = t.value; if (t.dataset.w === "name") renderTop(); touch(); return }
    const n = F.sel && nodeById(F.sel)
    if (!n || !t.dataset.f) return
    if (t.type === "radio") return
    let v = t.value
    if (t.dataset.num !== undefined) v = +v || 0
    setPath(n, t.dataset.f, v)
    if (t.dataset.f === "title") $(".ph h3", p).textContent = v
    refreshNode(n); touch()
    if (commit && t.tagName === "SELECT") renderPanel()
  }
  p.addEventListener("input", (ev) => { onVal(ev, false); refPopup(ev.target) })
  p.addEventListener("change", (ev) => {
    const t = ev.target, n = F.sel && nodeById(F.sel)
    if (t.name === "p-src" && n) { n.data.src = t.value; renderPanel(); refreshNode(n); touch(); return }
    if (t.tagName === "SELECT") onVal(ev, true)
  })
  p.addEventListener("keydown", (ev) => {
    const pop = $("#vpop"); if (!pop) return
    const items = $$("button", pop), i = items.findIndex((b) => b.classList.contains("on"))
    if (ev.key === "ArrowDown" || ev.key === "ArrowUp") { ev.preventDefault(); items.forEach((b) => b.classList.remove("on")); const j = (i + (ev.key === "ArrowDown" ? 1 : -1) + items.length) % items.length; items[j].classList.add("on"); items[j].scrollIntoView({ block: "nearest" }) }
    if (ev.key === "Enter" && i >= 0) { ev.preventDefault(); insertRef(items[i].dataset.vins) }
    if (ev.key === "Escape") pop.remove()
  })
  p.addEventListener("focusout", (ev) => { setTimeout(() => { const pop = $("#vpop"); if (pop && !pop.contains(document.activeElement) && document.activeElement !== refTarget) pop.remove() }, 150) })
}
/* 输入 {{ 弹出变量选择 */
let refTarget = null
function refPopup(el) {
  const old = $("#vpop"); if (old) old.remove()
  if (!el.classList || !el.classList.contains("refable")) return
  const pos = el.selectionStart, before = el.value.slice(0, pos)
  const m = before.match(/\{\{\s*([\w.]*)$/)
  if (!m) return
  refTarget = el
  const n = nodeById(F.sel), q = m[1].toLowerCase()
  let list = varsFor(n.id).map((v) => [v.ref, v.type, v.node.title])
  if (n.type === "loop") list.unshift([n.data.item || "item", "当前项", "批量处理"])
  list = list.concat(SYS_VARS.map(([r, t, d]) => [r, t, d])).filter(([r]) => !q || r.toLowerCase().includes(q))
  if (!list.length) return
  const pop = document.createElement("div")
  pop.className = "vpop"; pop.id = "vpop"
  pop.innerHTML = `<div class="vh">插入变量</div>` + list.map(([r, t, src], i) => `<button type="button" data-vins="${r}"${i ? "" : ' class="on"'}><code>{{${esc(r)}}}</code><small>${esc(src)} · ${esc(t)}</small></button>`).join("")
  el.parentElement.appendChild(pop)
}
function insertRef(ref) {
  const el = refTarget; const pop = $("#vpop"); if (pop) pop.remove()
  if (!el) return
  const pos = el.selectionStart, before = el.value.slice(0, pos).replace(/\{\{\s*[\w.]*$/, ""), after = el.value.slice(pos)
  el.value = before + "{{" + ref + "}}" + after
  const c = before.length + ref.length + 4
  el.focus(); el.setSelectionRange(c, c)
  el.dispatchEvent(new Event("input", { bubbles: true }))
}

  let q = "", field = n.type && F.pub.field !== "通用" ? F.pub.field : "全部"
  const mask = $("#mask")

    const kits = CATALOG.filter((k) => (field === "全部" || k.field === field || k.field === "通用"))
    const html = kits.map((k) => {
      const items = (k.server ? k.tools.map((t) => `${k.server}.${t[0]}`) : [`tool.${k.id}`]).map(toolOf).filter((t) => !q || (t.name + t.kit + t.key + t.desc).toLowerCase().includes(q))

      return `<div class="kitgrp">${icon(k.server ? "box" : "wrench", 14)}${esc(k.name)}${k.server ? `<small>MCP 服务 · ${esc(k.server)}</small>` : "<small>工具</small>"}</div>` + items.map((t) => `<label class="pick${chosen.has(t.key) ? " on" : ""}"><input type="${multi ? "checkbox" : "radio"}" name="tp" value="${t.key}" ${chosen.has(t.key) ? "checked" : ""} /><div><b>${esc(t.name)}<small class="mono">${esc(t.key)}</small></b><p>${esc(t.desc)}${t.out ? " · 输出：" + esc(t.out) : ""}</p></div></label>`).join("")
    }).join("")
    $("#tp-list").innerHTML = html || '<p class="hint" style="padding:20px 0;text-align:center">没有匹配的工具</p>'
    paintIcons($("#tp-list"))
  }
  mask.innerHTML = `<div class="dlg wide" role="dialog" aria-modal="true"><header><h3>${multi ? "添加可调用工具" : "选择工具"}</h3><button class="icon-btn" type="button" data-close>${icon("close", 18)}</button></header>
    <div class="dbody"><div class="row" style="gap:10px;align-items:flex-start"><div class="dsearch grow">${icon("search", 16)}<input id="tp-q" placeholder="搜索工具名、工具箱或调用名，如 RDKit、描述符、literature" /></div>${sel(`<select id="tp-f">${["全部"].concat(FIELDS).map((f) => `<option${f === field ? " selected" : ""}>${f}</option>`).join("")}</select>`)}</div>
      <p class="hint" style="margin:-2px 0 6px">只列出科学工具箱中 Agent 可调用的工具；计算软件按「工具箱 → 工具」两级组织。</p><div id="tp-list"></div></div>
    <footer><span class="note" id="tp-n">已选 ${chosen.size} 个</span><button class="btn ghost" type="button" data-close>取消</button><button class="btn" type="button" id="tp-ok">确定</button></footer></div>`
  mask.hidden = false
  draw()
  $("#tp-q").focus()
  $("#tp-q").addEventListener("input", (e) => { q = e.target.value.trim().toLowerCase(); draw() })
  $("#tp-f").addEventListener("change", (e) => { field = e.target.value; draw() })
  $("#tp-list").addEventListener("change", (e) => {
    const t = e.target
    if (!multi) chosen.clear()
    t.checked ? chosen.add(t.value) : chosen.delete(t.value)
    $$(".pick", $("#tp-list")).forEach((l) => l.classList.toggle("on", chosen.has($("input", l).value)))
    $("#tp-n").textContent = `已选 ${chosen.size} 个`
  })
  $("#tp-ok").addEventListener("click", () => {
    if (multi) n.data.tools = Array.from(chosen)
    else {
      const k = Array.from(chosen)[0]
      if (!k) { toast("请选择一个工具"); return }
      if (k !== n.data.tool) {

  })
