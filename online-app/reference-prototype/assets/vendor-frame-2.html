<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>科研技能 · AI4S</title>
  <style>
:root {
  --blue: #1765e3;
  --blue-hover: #0f58cf;
  --blue-soft: #ebf3ff;
  --blue-line: #8fb5ec;
  --ink: #15233b;
  --ink-2: #33415a;
  --muted: #6b7a90;
  --muted-2: #8e9bb0;
  --line: #e2e9f3;
  --line-2: #d5dfeb;
  --bg: #f4f7fc;
  --sider: 236px;
  --rail: 68px;
  font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", -apple-system, sans-serif;
  color: var(--ink);
  font-size: 14px;
  line-height: 1.5;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--bg); }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
input, textarea { border: 0; background: none; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
ul { margin: 0; padding: 0; list-style: none; }
svg { display: block; flex: none; }
[hidden] { display: none !important; }

/* ---------- 外壳 ---------- */
.app { display: grid; grid-template-columns: var(--sider) 1fr; min-height: 100vh; }
.app.is-rail { grid-template-columns: var(--rail) 1fr; }
.sider { background: #fff; border-right: 1px solid var(--line); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; z-index: 25; }
.sider-logo { height: 56px; display: flex; align-items: center; padding: 0 30px; border-bottom: 1px solid var(--line); }
.logo { display: flex; gap: 4px; align-items: center; color: var(--ink); text-decoration: none; }
.logo strong { display: block; font-size: 19px; line-height: 1; font-weight: 800; letter-spacing: .2px; color: #0e1c35; font-family: "Helvetica Neue", Arial, sans-serif; }
.logo em { display: block; font-style: normal; color: #2b5fb8; font-size: 10.5px; line-height: 1.1; margin-top: 2px; font-family: "Helvetica Neue", Arial, sans-serif; }
.sider-nav { padding: 12px 12px; display: flex; flex-direction: column; overflow: auto; flex: 1; }
.nav-sep { height: 1px; background: var(--line); margin: 8px 0; }
.nav-label { color: #7c8aa0; font-size: 12px; padding: 8px 12px 4px; }
.nav-item { display: flex; align-items: center; gap: 12px; height: 42px; padding: 0 12px; border-radius: 6px; color: var(--ink-2); text-decoration: none; position: relative; font-size: 14px; }
.nav-item svg { color: #3b475b; }
.nav-item .arrow { margin-left: auto; color: #6e7b90; }
.nav-item:hover { background: #f5f8fd; }
.nav-item.active { background: #eaf2fd; color: #1452b8; font-weight: 600; }
.nav-item.active svg { color: #1452b8; }
.nav-item.active::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; border-radius: 2px 0 0 2px; background: var(--blue); }
.is-rail .sider-logo { padding: 0; justify-content: center; }
.is-rail .logo span, .is-rail .nav-item > span, .is-rail .nav-item .arrow, .is-rail .nav-label, .is-rail .sider-foot span:last-child { display: none; }
.is-rail .nav-item { justify-content: center; padding: 0; }
.sider-foot { display: flex; align-items: center; gap: 8px; padding: 12px 16px; color: #8b98ab; font-size: 12px; border-top: 1px solid var(--line); }
.mark-n { width: 26px; height: 26px; border-radius: 50%; background: #111; color: #fff; display: grid; place-items: center; font-size: 12px; font-weight: 700; }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { height: 56px; background: #fff; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; padding: 0 20px 0 24px; position: sticky; top: 0; z-index: 20; }
.crumb { color: var(--muted); white-space: nowrap; font-size: 13px; margin-left: 4px; }
.crumb b { color: var(--ink); font-weight: 600; margin-left: 6px; }
.top-search { margin-left: auto; display: flex; align-items: center; gap: 8px; background: #f6f8fb; border: 1px solid #e3e9f1; height: 34px; border-radius: 6px; padding: 0 12px; width: 300px; color: #7d8aa0; }
.top-search input { width: 100%; outline: none; font-size: 13px; }
.top-search input::placeholder { color: #98a4b6; }
.top-actions { display: flex; align-items: center; gap: 12px; position: relative; }
.scope-btn { display: inline-flex; align-items: center; gap: 6px; height: 34px; border-radius: 6px; padding: 0 12px; background: #f6f8fb; border: 1px solid #e3e9f1; font-size: 13px; }
.scope-btn span { color: var(--muted); }
.scope-btn b { font-weight: 600; font-size: 12.5px; }
.icon-btn { width: 34px; height: 34px; border-radius: 8px; display: inline-grid; place-items: center; color: #3a475c; position: relative; }
.icon-btn:hover, .scope-btn:hover, .user-btn:hover { background: #f1f5fb; }
.has-dot::after { content: ""; position: absolute; top: 6px; right: 7px; width: 6px; height: 6px; border-radius: 50%; background: #e5484d; }
.user-btn { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 6px; border-radius: 8px; font-size: 14px; }
.user-btn i { width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(145deg, #6ea6f4, #3b7be0); color: #fff; display: grid; place-items: center; font-style: normal; font-size: 13px; }
.menu { position: absolute; top: 44px; background: #fff; border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 12px 32px rgba(24, 60, 120, .12); min-width: 170px; padding: 6px; z-index: 30; }
.menu button { display: block; width: 100%; text-align: left; padding: 8px 10px; border-radius: 6px; font-size: 13px; }
.menu button:hover { background: #f3f7fd; }
.menu button.on { color: var(--blue); background: var(--blue-soft); }
.menu-h { font-weight: 600; padding: 6px 10px 4px; font-size: 13px; }
.menu-p { color: var(--muted); padding: 0 10px 8px; font-size: 12px; }
.toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); background: #16263f; color: #fff; padding: 10px 18px; border-radius: 999px; z-index: 90; box-shadow: 0 10px 30px rgba(0,0,0,.18); font-size: 13px; }

/* ---------- 科研技能页面（沿用科学工具箱样式） ---------- */
.stage { position: relative; background:
  radial-gradient(900px 260px at 62% 60px, rgba(214, 229, 250, .75), rgba(244, 247, 252, 0) 70%),
  linear-gradient(180deg, #f2f6fc 0, #f5f8fc 420px, #f5f8fc 100%); flex: 1; }
.page { max-width: 1520px; margin: 0 auto; padding: 38px 60px 60px 100px; }
.tb-head { display: flex; align-items: flex-start; gap: 24px; min-height: 118px; position: relative; }
.tb-title h1 { font-size: 32px; line-height: 1.25; font-weight: 700; color: #0f1f3d; letter-spacing: .5px; }
.tb-title .kicker { font-size: 15.5px; font-weight: 700; color: #1b2c4b; margin-top: 4px; }
.tb-title .sub { font-size: 14.5px; color: #56657c; margin-top: 10px; }
.tb-art { position: absolute; left: 50%; top: -12px; width: 300px; height: 118px; transform: translateX(-4%); pointer-events: none; }
.tb-art .glow { position: absolute; inset: -30px -60px; background: radial-gradient(closest-side, rgba(196, 218, 250, .75), rgba(196, 218, 250, 0)); }
.tb-art svg.orbit { position: absolute; left: 0; top: 0; }
.tile { position: absolute; display: grid; place-items: center; color: #fff; border-radius: 8px; }
.tile-ai { left: 116px; top: 3px; width: 64px; height: 64px; border-radius: 10px; font-size: 25px; font-weight: 500; font-family: "Helvetica Neue", Arial, sans-serif; background: linear-gradient(160deg, #7cb2f7 0%, #3f82ea 100%); box-shadow: 0 10px 22px rgba(61, 125, 232, .32), inset 0 1px 0 rgba(255,255,255,.35); }
.tile-l { left: 0; top: 55px; width: 46px; height: 46px; background: linear-gradient(160deg, #b9d4fa, #7eabf0); box-shadow: 0 8px 18px rgba(92, 145, 230, .25); }
.tile-r { left: 265px; top: 64px; width: 46px; height: 46px; background: linear-gradient(160deg, #b9d4fa, #7eabf0); box-shadow: 0 8px 18px rgba(92, 145, 230, .25); }
.tb-actions { margin-left: auto; display: flex; gap: 14px; margin-top: 22px; position: relative; z-index: 1; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--blue); color: #fff; border-radius: 6px; height: 34px; padding: 0 16px; font-size: 14px; white-space: nowrap; }
.btn:hover { background: var(--blue-hover); }
.btn.lg { height: 42px; padding: 0 22px; font-size: 14.5px; box-shadow: 0 6px 14px rgba(23, 101, 227, .22); }
.btn.ghost { background: #fff; color: #1d2a40; border: 1px solid var(--line-2); box-shadow: none; }
.btn.ghost:hover { border-color: #b9cbe3; background: #fbfcff; }
.btn:disabled { background: #a8c6f4; cursor: not-allowed; }
.btn.sm { height: 28px; padding: 0 12px; font-size: 13px; border-radius: 5px; }
.btn.sm.ghost { color: #25324a; }

.tb-search { margin-top: 20px; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 11px 18px; box-shadow: 0 4px 16px rgba(30, 80, 150, .04); }
.tb-search form { display: flex; align-items: stretch; height: 46px; }
.tb-search label { flex: 1; display: flex; align-items: center; gap: 12px; border: 1px solid var(--line-2); border-right: 0; border-radius: 6px 0 0 6px; padding: 0 16px; color: #5d6b80; }
.tb-search input { flex: 1; outline: none; font-size: 14px; height: 100%; }
.tb-search input::placeholder { color: #9aa6b8; }
.tb-search .btn { height: auto; border-radius: 0 6px 6px 0; width: 88px; font-size: 14.5px; }

.filters { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.filters[data-group="field"] { margin-top: 18px; }
.filters .lbl { width: 76px; flex: none; font-weight: 600; color: #1d2a40; font-size: 13px; margin-right: -8px; }
.filter-box { margin-top: 18px; }
.filter-box .filters { margin-top: 8px; }
.filter-box .filters[data-group="field"] { margin-top: 0; }
.filters[hidden] { display: none; }
.filters.sub .chip { height: 24px; font-size: 12px; background: #fafbfd; }
.fmore, .fclear { height: 26px; padding: 0 6px; font-size: 12.5px; color: var(--blue); display: inline-flex; align-items: center; gap: 2px; background: none; }
.fclear { color: var(--muted); margin-left: 6px; }
.fclear:hover { color: var(--blue); }
.checks { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.checks label { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; color: #34425a; }
.field .checks input { padding: 0; width: auto; }
.field small.opt { font-size: 12px; color: var(--muted); margin-left: 6px; }
.field .inline { display: flex; align-items: center; gap: 8px; font-size: 12.5px; margin-top: 4px; }
.kv-note { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }
.chip { height: 26px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line-2); background: #fff; color: #34425a; font-size: 12.5px; }
.chip:hover { border-color: #aac3e6; color: var(--blue); }
.chip.on { background: #eaf2fe; border-color: var(--blue-line); color: #1356c2; }

.tb-bar { display: flex; align-items: flex-end; justify-content: space-between; margin-top: 18px; border-bottom: 1px solid var(--line); }
.tabs { display: flex; gap: 0; }
.tabs button { height: 48px; padding: 0 12px; margin-right: 18px; font-size: 14px; color: #3a475d; position: relative; }
.tabs button:hover { color: var(--blue); }
.tabs button.on { color: #1356c2; }
.tabs button.on::after { content: ""; position: absolute; left: 6px; right: 6px; bottom: -1px; height: 3px; border-radius: 2px; background: var(--blue); }
.bar-tools { display: flex; align-items: center; gap: 10px; padding-bottom: 8px; color: #56657c; font-size: 12.5px; }
.bar-tools .count { margin-right: 4px; }
.select { position: relative; }
.select select { appearance: none; -webkit-appearance: none; height: 34px; width: 122px; border-radius: 6px; border: 1px solid var(--line-2); background: #fff; padding: 0 30px 0 14px; font-size: 13.5px; color: #25324a; outline: none; }
.select svg { position: absolute; right: 9px; top: 10px; color: #5d6b80; pointer-events: none; }
.view-btn { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 14px; border-radius: 6px; border: 1px solid var(--line-2); background: #fff; color: #6b7a90; font-size: 13.5px; }
.view-btn.on { background: var(--blue); border-color: var(--blue); color: #fff; }

.hot { margin-top: 26px; border-radius: 12px; padding: 14px 14px 16px; background: linear-gradient(100deg, #ecf3fd 0%, #eaf2fd 60%, #e7f0fc 100%); border: 1px solid #e4edf9; }
.hot > header { display: flex; align-items: baseline; gap: 8px; padding: 0 2px 12px; }
.hot > header svg { color: #e2a12b; align-self: center; }
.hot > header b { font-size: 16px; font-weight: 500; color: #1c2a42; }
.hot > header span { font-size: 12px; color: #6b7a90; }
.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.hot .grid { gap: 16px; }

.card { position: relative; background: #fff; border: 1px solid var(--line); border-radius: 8px; display: grid; grid-template-columns: 40px minmax(0, 1fr); column-gap: 12px; padding: 14px 16px; min-width: 0; }
.card.feature { padding: 14px 16px; border-color: #e3ebf6; }
.tools-grid { margin-top: 14px; }
.tools-grid .card { grid-template-rows: 1fr auto; padding: 14px 16px 12px; transition: box-shadow .15s, border-color .15s; }
.tools-grid .card:hover { border-color: #c8d9f1; box-shadow: 0 8px 22px rgba(30, 80, 150, .07); }
.ic { width: 40px; height: 40px; border-radius: 9px; display: grid; place-items: center; color: #fff; }
.ic-blue   { background: linear-gradient(160deg, #5aa1fb 0%, #2f78ea 100%); box-shadow: 0 6px 14px rgba(47, 120, 234, .28); }
.ic-purple { background: linear-gradient(160deg, #b36bf8 0%, #8a3fe8 100%); box-shadow: 0 6px 14px rgba(138, 63, 232, .26); }
.ic-green  { background: linear-gradient(160deg, #4fd083 0%, #1fa75c 100%); box-shadow: 0 6px 14px rgba(31, 167, 92, .26); }
.ic-orange { background: linear-gradient(160deg, #ff9a52 0%, #f46a26 100%); box-shadow: 0 6px 14px rgba(244, 106, 38, .26); }
.ic-pink   { background: linear-gradient(160deg, #f76aa3 0%, #e63d7f 100%); box-shadow: 0 6px 14px rgba(230, 61, 127, .26); }
.ic-teal   { background: linear-gradient(160deg, #3ed1d6 0%, #13a8b4 100%); box-shadow: 0 6px 14px rgba(19, 168, 180, .26); }
.body { min-width: 0; display: flex; flex-direction: column; }
.body b.name { font-size: 15px; font-weight: 500; color: #15233b; line-height: 1.4; padding-right: 26px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 5px; }
.tags em { font-style: normal; font-size: 12px; line-height: 20px; height: 20px; padding: 0 6px; border-radius: 3px; color: #637188; background: #f1f4f8; white-space: nowrap; }
.tags em.ok { color: #1f9a57; background: #e8f7ee; }
.tags em.official { color: #2167d4; background: #e7f0fd; }
.tags em.kind { font-weight: 600; }
.tags em.k-mcp { color: #2167d4; background: #eaf2fe; }
.tags em.k-fn { color: #4a5a73; background: #eef1f5; }
.tags em.k-comp { color: #0f8a7e; background: #e5f6f4; }
.pbox ol.steps { margin: 6px 0 0; padding-left: 20px; }
.pbox ol.steps li { margin: 3px 0; }
.desc { font-size: 13px; color: #4c5a70; margin-top: 6px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
.card footer { grid-column: 2; align-self: end; margin-top: 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; min-width: 0; }
.meta { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; color: #7a879b; font-size: 12px; white-space: nowrap; overflow: hidden; }
.meta span { display: inline-flex; align-items: center; gap: 4px; flex: none; }
.meta span.owner { flex: 0 1 auto; min-width: 0; }
.meta span.owner i { font-style: normal; overflow: hidden; text-overflow: ellipsis; }
.meta svg { color: #7a879b; }
.ops { display: flex; gap: 8px; flex: none; }
.more { position: absolute; right: 12px; top: 8px; width: 26px; height: 24px; border-radius: 5px; display: grid; place-items: center; color: #5b687d; }
.more:hover { background: #f1f5fb; }
.more-menu { right: 8px; top: 34px; min-width: 132px; }

.list { margin-top: 16px; background: #fff; border: 1px solid var(--line); border-radius: 8px; }
.list-row { display: grid; grid-template-columns: 48px minmax(0, 1fr) 280px auto; gap: 16px; align-items: center; padding: 14px 20px; border-top: 1px solid #eef2f8; }
.list-row:first-child { border-top: 0; }
.list-row .ic { width: 40px; height: 40px; margin: 0; }
.empty { margin-top: 16px; background: #fff; border: 1px dashed var(--line-2); border-radius: 8px; padding: 36px; text-align: center; color: var(--muted); }

.mask { position: fixed; inset: 0; background: rgba(15, 28, 50, .3); z-index: 60; display: flex; }
.mask.drawer-mask { justify-content: flex-end; }
.drawer { width: min(440px, 100%); height: 100%; background: #fff; padding: 18px 22px; box-shadow: -12px 0 40px rgba(0,0,0,.08); overflow: auto; }
.drawer.wide { width: min(640px, 100%); }
.btn.auto { cursor: default; background: #effaf3; color: #1f7a45; box-shadow: inset 0 0 0 1px #bfe5cd; }
.btn.auto:hover { background: #effaf3; }
.kbind { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 6px; }
.kbind > span { font-size: 12px; color: #8390a4; }
.bchip { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 8px; border-radius: 5px; font-size: 12px; color: #25324a; background: #f4f8fe; border: 1px solid #d6e4f8; cursor: default; }
a.bchip { cursor: pointer; }
a.bchip:hover { border-color: var(--blue-line); color: var(--blue); }
.bchip.tool { background: #f6f4fd; border-color: #e0daf6; }
.bchip em { font-style: normal; font-size: 11px; color: #1356c2; }
.bchip.tool em { color: #6547c9; }
.bchip small { font-size: 11.5px; color: var(--muted); }
.bchip small::before { content: "· "; }
.bchip i { font-style: normal; font-size: 11px; color: #1f7a45; }
.bmore { font-size: 12px; color: var(--muted); }
.bind-field > span small { display: block; margin-top: 2px; font-size: 12px; color: var(--muted); }
.brow { display: grid; grid-template-columns: minmax(0, 1.4fr) 92px minmax(0, 1fr) 28px; gap: 8px; align-items: center; margin-bottom: 8px; }
.brow select, .brow input { min-width: 0; border: 1px solid var(--line-2); border-radius: 6px; padding: 6px 8px; background: #fff; font-size: 12.5px; }
.brow select:disabled { background: #f6f8fb; color: #56657c; }
.bquick { display: flex; flex-wrap: wrap; gap: 6px; }
.bempty { font-size: 12.5px; color: var(--muted); margin: 0 0 8px; }
.lchip.grp { cursor: pointer; padding-right: 8px; color: #43516a; background: #f6f8fb; border-style: dashed; }
.lchip.grp .ic { background: #eef2f8; color: #56657c; }
.lchip.grp svg:last-child { transition: transform .15s; }
.lchip.grp.on svg:last-child { transform: rotate(180deg); }
.lp-chips.sub { margin-top: 8px; padding: 8px; border-radius: 6px; background: #f6f8fb; }
.lchip.comp { padding-right: 8px; }
.lchip .src.ok { color: #1f7a45; background: #effaf3; }
.lp-note { margin-top: 10px; font-size: 12.5px; color: var(--muted); }
.lp-note a { color: var(--blue); cursor: pointer; }
.dtabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line-2); margin: 16px 0 14px; }
.dtabs button { height: 36px; padding: 0 14px; font-size: 13.5px; color: #43516a; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.dtabs button.on { color: var(--blue); border-bottom-color: var(--blue); font-weight: 600; }
.pbox { border: 1px solid #e3e9f3; border-radius: 8px; padding: 12px 14px; margin-bottom: 10px; font-size: 13px; color: #43516a; line-height: 1.65; }
.pbox h4 { display: flex; align-items: center; gap: 6px; font-size: 13.5px; color: #1d2b44; margin-bottom: 6px; }
.pbox h4 i { font-style: normal; font-size: 11.5px; color: #1356c2; background: #eaf2fe; border-radius: 4px; padding: 0 6px; line-height: 18px; }
.pbox ul { padding-left: 16px; margin: 0; }
.pbox code, .etable code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; background: #f3f6fb; border-radius: 3px; padding: 0 4px; }
.etable { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 4px; }
.etable th, .etable td { text-align: left; padding: 6px 8px; border-top: 1px solid #eef2f8; vertical-align: top; }
.etable th { color: var(--muted); font-weight: 500; }
.code-head { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 6px; font-size: 13px; color: #1d2b44; font-weight: 600; }

  else if (minor > 0) out.push(["V1.0", "2026-06-12", "首次发布"])

}

function chips(group, options, current) {
  const box = document.querySelector(`[data-group="${group}"]`)
  const label = box.querySelector(".lbl").outerHTML
  box.hidden = !options || (group === "dir" && options.length <= 1)
  if (!options) return
  const open = state.fOpen[group]
  const over = options.length - 1 > DIM_LIMIT
  const shown = over && !open ? options.filter((op, i) => i <= DIM_LIMIT || op === current) : options
  const last = group === DIMS[DIMS.length - 1][0] && anyFilter()
  box.innerHTML = label + shown.map((op) => `<button type="button" class="chip ${op === current ? "on" : ""}" data-filter="${group}" data-value="${esc(op)}">${esc(op)}</button>`).join("")
    + (over ? `<button type="button" class="fmore" data-fmore="${group}">${open ? "收起" : `更多 ${options.length - shown.length}`}${icon("down", 12, 2)}</button>` : "")
    + (last ? `<button type="button" class="fclear" data-fclear="1">清空筛选</button>` : "")

function cascadeOptions() {
  const out = {}
  let pool = ITEMS
  DIMS.forEach(([key, , all, get]) => {
    const have = new Set(pool.flatMap(get))
    const options = key === "field" ? all() : all().filter((op) => op === "全部" || have.has(op))
    if (!options.includes(state[key])) state[key] = "全部"
    out[key] = options
    if (state[key] !== "全部") pool = pool.filter((item) => get(item).includes(state[key]))
  })
  return out
}

function visible() {
  const q = state.query.trim().toLowerCase()
  let list = ITEMS.filter((item) => {
    if (q) { const hay = PAGE.searchText(item).toLowerCase(); if (!q.split(/[\s,，、]+/).filter(Boolean).every((w) => hay.includes(w))) return false }
    if (!DIMS.every(([k, , , get]) => state[k] === "全部" || get(item).includes(state[k]))) return false
    if (state.tab === "已加载") return isLoaded(item.id)
    if (state.tab === "最近使用") return item.recent
    if (state.tab === "我的收藏") return favs.has(item.id)
    if (state.tab === "我创建的") return item.owner === "林夏"
    return true
  })
  list = [...list]
  if (state.sort === "名称") list.sort((a, b) => a.name.localeCompare(b.name, "zh"))
  if (state.sort === "最近更新") list.sort((a, b) => String(b.updated).localeCompare(String(a.updated)))
  if (state.sort === "最多使用") list.sort((a, b) => numOf(b.calls) - numOf(a.calls))
  return list
}

  const file = e.target.files && e.target.files[0]
  e.target.value = ""
  if (!file) return
  addItem(PAGE.importItem(file))
  state.tab = PAGE.tabs[0]
  toast(`已导入 ${file.name}`)
  render()
})
document.getElementById("scope-btn").addEventListener("click", (e) => {
  e.stopPropagation()
  document.getElementById("scope-menu").innerHTML = SPACES.map((name) => `<button type="button" class="${name === state.space ? "on" : ""}" data-space="${esc(name)}">${esc(name)}</button>`).join("")
  toggleMenu("scope-menu")
})
document.getElementById("bell-btn").addEventListener("click", (e) => { e.stopPropagation(); toggleMenu("bell-menu") })
document.getElementById("help-btn").addEventListener("click", (e) => { e.stopPropagation(); toggleMenu("help-menu") })
document.getElementById("user-btn").addEventListener("click", () => toast("这是原型，账号保持登录"))

document.body.addEventListener("click", (e) => {
  const t = e.target
  const inMenu = t.closest(".menu")
  const act = t.closest("[data-act]")
  if (act) { const [name, arg, arg2] = act.dataset.act.split("|"); PAGE.action(name, arg, arg2); return }
  const load = t.closest("[data-load]")
  if (load) {
    const item = findItem(load.dataset.load)
    toggleLoad(item)
    if (!document.getElementById("drawer").hidden) { state.keepScroll = true; openDrawer(item) }
    render(); return
  }
  const unload = t.closest("[data-unload]")
  if (unload) { toggleLoad(findItem(unload.dataset.unload)); render(); return }
  const lp = t.closest("[data-lp]")
  if (lp) {
    const a = lp.dataset.lp
    const info = spaceInfo()
    if (a === "fold") { state.lpOpen = !state.lpOpen; render() }
    if (a === "clear") {
      const n = Object.keys(info.loaded).length
      info.loaded = {}
      toast(`已清空「${state.space}」的 ${n} 个已加载${PAGE.unit}`)
      render()
    }
    return
  }
  const fmore = t.closest("[data-fmore]")
  if (fmore) { state.fOpen[fmore.dataset.fmore] = !state.fOpen[fmore.dataset.fmore]; render(); return }
  if (t.closest("[data-fclear]")) { DIMS.forEach(([k]) => { state[k] = "全部" }); render(); return }
  const filter = t.closest("[data-filter]")
  if (filter) { state[filter.dataset.filter] = filter.dataset.value; render(); return }
  const tab = t.closest("[data-tab]")
  if (tab) { state.tab = tab.dataset.tab; render(); return }
  const view = t.closest("[data-view]")
  if (view) { state.view = view.dataset.view; render(); return }
  const more = t.closest("[data-more]")
  if (more) { state.menu = state.menu === more.dataset.more ? null : more.dataset.more; render(); return }
  const detail = t.closest("[data-detail]")
  if (detail) { state.dtab = ""; openDrawer(findItem(detail.dataset.detail)); render(); return }
  const dtab = t.closest("[data-dtab]")
  if (dtab) { state.dtab = dtab.dataset.dtab; openDrawer(findItem(openId())); return }
  const cp = t.closest("[data-copytext]")
  if (cp) {
    const el = document.getElementById(cp.dataset.copytext)
    if (el && navigator.clipboard) navigator.clipboard.writeText(el.textContent).catch(() => {})
    toast("已复制"); return
  }
  const copy = t.closest("[data-copy]")
  if (copy) {
    const name = findItem(copy.dataset.copy).name
    if (navigator.clipboard) navigator.clipboard.writeText(name).catch(() => {})
    state.menu = null; render(); toast(`已复制「${name}」`); return
  }
  const fav = t.closest("[data-fav]")
  if (fav) {
    const id = fav.dataset.fav
    const item = findItem(id)
    if (favs.has(id)) { favs.delete(id); item.favs -= 1; toast("已取消收藏") } else { favs.add(id); item.favs += 1; toast("已收藏") }
    state.menu = null
    if (!document.getElementById("drawer").hidden) { state.keepScroll = true; openDrawer(item) }
    render(); return
  }
  const close = t.closest("[data-close]")
  if (close) { document.getElementById(close.dataset.close).hidden = true; return }
  const space = t.closest("[data-space]")
  if (space) {
    state.space = space.dataset.space
    state.lpOpen = false
    document.getElementById("scope-label").textContent = state.space
    toggleMenu(null)
    document.getElementById("drawer").hidden = true
    render()
    const n = Object.keys(loadedOf()).length
    toast(`课题空间已切换为${state.space}，${n ? `已加载 ${n} 个${PAGE.unit}` : `还没有加载${PAGE.unit}`}`)
    return
  }
  if (t.id === "drawer" || t.id === "modal") t.hidden = true
  if (!inMenu) {
    toggleMenu(null)
    if (state.menu) { state.menu = null; render() }
  }
})
document.body.addEventListener("change", (e) => {
  if (e.target.name === "field" && e.target.closest("#create-form")) {
    document.getElementById("dir-checks").innerHTML = dirChecks(e.target.value)
    return
  }
  if (PAGE.onChange) PAGE.onChange(e)
})
document.body.addEventListener("submit", (e) => {
  if (e.target.id !== "create-form") return
  e.preventDefault()
  const res = PAGE.createSubmit(new FormData(e.target))
  if (typeof res === "string") { toast(res); return }
  addItem(res.item)
  document.getElementById("modal").hidden = true
  state.tab = PAGE.tabs[0]
  toast(res.msg)
  render()
})
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return
  document.getElementById("drawer").hidden = true
  document.getElementById("modal").hidden = true
  toggleMenu(null)
  if (state.menu) { state.menu = null; render() }
})

paintIcons(document)
// 从独立配置页发布后回到列表：#created=<JSON>
;(function takeCreated() {
  const m = /^#created=(.+)$/.exec(location.hash || "")
  if (!m || !PAGE.fromCreated) return
  try {
    const res = PAGE.fromCreated(JSON.parse(decodeURIComponent(m[1])))
    addItem(res.item)
    state.tab = "我创建的"
    if (location.protocol !== "about:" && history.replaceState) history.replaceState(null, "", location.pathname)
    setTimeout(() => toast(res.msg), 0)
  } catch (err) { /* 参数损坏时忽略 */ }
})()
render()

</script>
